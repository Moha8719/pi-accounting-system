<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Merchant OS v2.3</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#2e004a}
body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:10px}
.container{max-width:1000px;margin:auto;background:rgba(255,255,255,.08);padding:15px;border-radius:16px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.tab{padding:8px 12px;background:rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.tab.active{background:var(--p);color:#2e004a}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:8px 0}
.btn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin:3px}
.btn-pi{background:var(--p);color:#2e004a}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}.btn-g{background:#eee;color:#333}
input,select{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--s);margin:4px 0;box-sizing:border-box}
table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;font-size:13px}th{background:var(--s);color:#fff}
.badge{display:inline-block;background:#e0ffe0;color:#0a0;padding:4px 8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;justify-content:space-between">
<div>👋 Pi Merchant OS v2.3</div>
<select id="lang-picker" style="width:auto"><option value="ar">العربية</option><option value="en">English</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select>
</div>
<h2 id="main-title" style="text-align:center;color:var(--p)">نظام التاجر الذكي</h2>
<div class="tabs">
<div class="tab active" data-tab="entry" id="lb-entry">قيد</div><div class="tab" data-tab="invoice" id="lb-inv">فاتورة</div><div class="tab" data-tab="inventory" id="lb-stock">مخزون</div><div class="tab" data-tab="partners" id="lb-part">عملاء</div><div class="tab" data-tab="reports" id="lb-rep">تقارير</div><div class="tab" data-tab="pay" id="lb-pay">Pi</div>
</div>

<div id="entry" class="tab-content active"><div class="card"><h3 id="h-entry">إضافة قيد</h3><form id="form-entry"><select id="e-type"><option value="income" id="op-inc">إيراد</option><option value="expense" id="op-exp">مصروف</option><option value="asset" id="op-ast">أصل</option></select><input id="e-amount" type="number" step="0.0001" placeholder="المبلغ π" required><input id="e-desc" placeholder="الوصف" required><button class="btn btn-pi" type="submit" id="btn-save-entry">حفظ</button></form></div><div class="card"><table><tbody id="ledger-body"></tbody></table></div></div>

<div id="invoice" class="tab-content">
<div class="card"><h3 id="h-inv">إنشاء فاتورة - جديد</h3>
<input id="inv-customer" placeholder="اسم العميل">
<select id="inv-product"></select>
<input id="inv-qty" type="number" value="1" min="1">
<button class="btn btn-pi" type="button" id="btn-add-inv">إضافة للفاتورة</button>
<div id="inv-items" style="margin:10px 0;background:#f9f9f9;padding:8px;border-radius:8px"></div>
<h4><span id="lb-total">الإجمالي</span>: <span id="inv-total">0</span> π</h4>
<button class="btn btn-pi" type="button" id="btn-save-inv" style="width:100%;font-size:16px">💾 حفظ الفاتورة (يخصم المخزون)</button>
<div id="invoice-actions" style="display:none;margin-top:12px;border-top:2px dashed #6a1b9a;padding-top:10px">
<span class="badge">✓ تم حفظ الفاتورة</span>
<button class="btn btn-s" type="button" id="btn-pdf-last">📄 تحميل PDF</button>
<button class="btn btn-w" type="button" id="btn-wa-last">📱 إرسال WhatsApp</button>
<button class="btn btn-g" type="button" id="btn-new-inv">+ فاتورة جديدة</button>
</div>
</div>
<div class="card"><h4 id="h-saved">الفواتير المحفوظة</h4><div id="saved-invoices"></div></div>
</div>

<div id="inventory" class="tab-content"><div class="card"><form id="form-inv"><input id="p-name" placeholder="اسم المنتج" required><input id="p-qty" type="number" placeholder="الكمية" required><input id="p-price" type="number" step="0.0001" placeholder="سعر البيع" required><input id="p-cost" type="number" step="0.0001" placeholder="التكلفة"><button class="btn btn-pi" type="submit" id="btn-add-prod">إضافة منتج</button></form></div><div class="card"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Barcode</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>

<div id="partners" class="tab-content"><div class="card"><form id="form-part"><input id="pt-name" placeholder="الاسم" required><select id="pt-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select><input id="pt-phone" placeholder="967..."><button class="btn btn-pi" type="submit">حفظ</button></form></div><div class="card"><table><tbody id="pt-body"></tbody></table></div></div>

<div id="reports" class="tab-content"><div class="card"><p><span id="lb-inc">إيراد</span>: <span id="r-inc">0</span> | <span id="lb-exp">مصروف</span>: <span id="r-exp">0</span> | <b id="lb-net">صافي</b>: <b id="r-net">0</b></p><div style="background:#fff;padding:8px;border-radius:8px"><canvas id="financeChart"></canvas></div><button class="btn btn-s" type="button" id="btn-excel">Excel</button><button class="btn btn-s" type="button" id="btn-report-pdf">PDF</button></div></div>

<div id="pay" class="tab-content"><div class="card"><input id="pay_amount" type="number" value="1"><button class="btn btn-pi" type="button" id="btn-pi-pay">Pay with Pi</button><div id="pi-status"></div></div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
const T={ar:{main:'نظام التاجر الذكي',app:'Pi Merchant OS v2.3',e:'قيد',inv:'فاتورة',stock:'مخزون',part:'عملاء',rep:'تقارير',pay:'Pi',hE:'إضافة قيد',hI:'إنشاء فاتورة - جديد',save:'حفظ',inc:'إيراد',exp:'مصروف',ast:'أصل',total:'الإجمالي',addInv:'إضافة للفاتورة',addProd:'إضافة منتج',income:'إيراد',expense:'مصروف',net:'صافي',saved:'الفواتير المحفوظة'},en:{main:'Smart Merchant System',app:'Pi Merchant OS v2.3',e:'Entry',inv:'Invoice',stock:'Stock',part:'Partners',rep:'Reports',pay:'Pi',hE:'Add Entry',hI:'Create Invoice - New',save:'Save',inc:'Income',exp:'Expense',ast:'Asset',total:'Total',addInv:'Add to Invoice',addProd:'Add Product',income:'Income',expense:'Expense',net:'Net',saved:'Saved Invoices'},tr:{main:'Akıllı Tüccar Sistemi',app:'Pi Merchant OS v2.3',e:'Kayıt',inv:'Fatura',stock:'Stok',part:'Ortaklar',rep:'Raporlar',pay:'Pi',hE:'Kayıt Ekle',hI:'Fatura Oluştur - Yeni',save:'Kaydet',inc:'Gelir',exp:'Gider',ast:'Varlık',total:'Toplam',addInv:'Faturaya Ekle',addProd:'Ürün Ekle',income:'Gelir',expense:'Gider',net:'Net',saved:'Kaydedilen Faturalar'},zh:{main:'智能商家系统',app:'Pi Merchant OS v2.3',e:'分录',inv:'发票',stock:'库存',part:'合作伙伴',rep:'报告',pay:'Pi',hE:'添加分录',hI:'创建发票 - 新',save:'保存',inc:'收入',exp:'支出',ast:'资产',total:'总计',addInv:'添加到发票',addProd:'添加产品',income:'收入',expense:'支出',net:'净额',saved:'已保存发票'},ja:{main:'スマートマーチャント',app:'Pi Merchant OS v2.3',e:'仕訳',inv:'請求書',stock:'在庫',part:'パートナー',rep:'レポート',pay:'Pi',hE:'仕訳追加',hI:'請求書作成 - 新',save:'保存',inc:'収入',exp:'経費',ast:'資産',total:'合計',addInv:'請求書に追加',addProd:'商品追加',income:'収入',expense:'経費',net:'純利益',saved:'保存済み請求書'},vi:{main:'Hệ thống thương nhân',app:'Pi Merchant OS v2.3',e:'Bút toán',inv:'Hóa đơn',stock:'Kho',part:'Đối tác',rep:'Báo cáo',pay:'Pi',hE:'Thêm bút toán',hI:'Tạo hóa đơn - Mới',save:'Lưu',inc:'Thu nhập',exp:'Chi phí',ast:'Tài sản',total:'Tổng',addInv:'Thêm vào HĐ',addProd:'Thêm SP',income:'Thu nhập',expense:'Chi phí',net:'Ròng',saved:'Hóa đơn đã lưu'},fr:{main:'Système Marchand',app:'Pi Merchant OS v2.3',e:'Écriture',inv:'Facture',stock:'Stock',part:'Partenaires',rep:'Rapports',pay:'Pi',hE:'Ajouter',hI:'Créer Facture - Nouveau',save:'Enregistrer',inc:'Revenu',exp:'Dépense',ast:'Actif',total:'Total',addInv:'Ajouter',addProd:'Ajouter Produit',income:'Revenu',expense:'Dépense',net:'Net',saved:'Factures Enregistrées'},de:{main:'Händler System',app:'Pi Merchant OS v2.3',e:'Buchung',inv:'Rechnung',stock:'Lager',part:'Partner',rep:'Berichte',pay:'Pi',hE:'Buchung',hI:'Rechnung - Neu',save:'Speichern',inc:'Einnahme',exp:'Ausgabe',ast:'Anlage',total:'Gesamt',addInv:'Hinzufügen',addProd:'Produkt',income:'Einnahme',expense:'Ausgabe',net:'Netto',saved:'Gespeicherte Rechnungen'},es:{main:'Sistema Comerciante',app:'Pi Merchant OS v2.3',e:'Asiento',inv:'Factura',stock:'Inventario',part:'Socios',rep:'Informes',pay:'Pi',hE:'Añadir',hI:'Crear Factura - Nuevo',save:'Guardar',inc:'Ingreso',exp:'Gasto',ast:'Activo',total:'Total',addInv:'Añadir',addProd:'Añadir Producto',income:'Ingreso',expense:'Gasto',net:'Neto',saved:'Facturas Guardadas'}};

function applyLang(l){var t=T[l]||T.en;document.documentElement.lang=l;document.documentElement.dir=(l==='ar')?'rtl':'ltr';document.getElementById('main-title').textContent=t.main;document.getElementById('lb-entry').textContent=t.e;document.getElementById('lb-inv').textContent=t.inv;document.getElementById('lb-stock').textContent=t.stock;document.getElementById('lb-part').textContent=t.part;document.getElementById('lb-rep').textContent=t.rep;document.getElementById('lb-pay').textContent=t.pay;document.getElementById('h-entry').textContent=t.hE;document.getElementById('h-inv').textContent=t.hI;document.getElementById('btn-save-entry').textContent=t.save;document.getElementById('btn-add-inv').textContent=t.addInv;document.getElementById('btn-add-prod').textContent=t.addProd;document.getElementById('op-inc').textContent=t.inc;document.getElementById('op-exp').textContent=t.exp;document.getElementById('op-ast').textContent=t.ast;document.getElementById('lb-total').textContent=t.total;document.getElementById('lb-inc').textContent=t.income;document.getElementById('lb-exp').textContent=t.expense;document.getElementById('lb-net').textContent=t.net;document.getElementById('h-saved').textContent=t.saved;localStorage.setItem('erp_lang',l);}
var picker=document.getElementById('lang-picker');var saved=localStorage.getItem('erp_lang')||'ar';picker.value=saved;applyLang(saved);picker.addEventListener('change',function(){applyLang(this.value);});

var ledger=JSON.parse(localStorage.getItem('ledger')||'[]');
var inv=JSON.parse(localStorage.getItem('inv2')||'[]');
var partners=JSON.parse(localStorage.getItem('partners2')||'[]');
var invoices=JSON.parse(localStorage.getItem('invoices_v23')||'[]');
var curInv=[];var invTotal=0;var lastSavedInvoice=null;var chart=null;

document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active')});tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active');});});

function renderLedger(){document.getElementById('ledger-body').innerHTML=ledger.slice(-20).reverse().map(function(l){return '<tr><td>'+l.date+'</td><td>'+l.desc+'</td><td>'+l.type+'</td><td>'+l.amount+'</td></tr>';}).join('');}
function renderInv(){document.getElementById('inv-body').innerHTML=inv.map(function(p,i){return '<tr><td>'+p.name+'</td><td>'+p.qty+'</td><td>'+p.price+'</td><td><svg id="bc'+i+'"></svg></td><td><button type="button" onclick="window.delInv('+i+')">x</button></td></tr>';}).join('');document.getElementById('inv-product').innerHTML=inv.map(function(p,i){return '<option value="'+i+'">'+p.name+' - '+p.price+' Pi (Qty:'+p.qty+')</option>';}).join('');setTimeout(function(){inv.forEach(function(p,i){try{JsBarcode('#bc'+i,p.name.substring(0,8)+i,{width:1,height:18,displayValue:false});}catch(e){}});},200);}
function renderPartners(){document.getElementById('pt-body').innerHTML=partners.map(function(p){return '<tr><td>'+p.name+'</td><td>'+p.type+'</td><td>'+p.phone+'</td><td><a class="btn btn-w" target="_blank" href="https://wa.me/'+p.phone+'">WA</a></td></tr>';}).join('');}
window.delInv=function(i){inv.splice(i,1);
