<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Accounting ERP - Pi Network</title>
    
    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <!-- Chart.js للرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-color: #ffd700;
            --secondary-color: #6a1b9a;
            --text-color: #ffffff;
            --bg-color: #2e004a;
            --container-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--primary-color);
        }

        .pi-icon {
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
            margin: 5px 0;
        }

        .btn-pi {
            background-color: var(--primary-color);
            color: #2e004a;
        }

        .btn-pi:hover {
            background-color: #fffb00;
        }

        .btn-sec {
            background-color: var(--secondary-color);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            text-align: inherit;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
        }

        .tab {
            padding: 10px 15px;
            cursor: pointer;
            color: var(--text-color);
            border-radius: 10px 10px 0 0;
            background-color: rgba(255, 255, 255, 0.05);
            margin: 2px;
            font-size: 13px;
        }

        .tab.active {
            background-color: var(--secondary-color);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .lang-select {
            width: auto;
            padding: 5px 10px;
            background: var(--secondary-color);
            color: white;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .chart-container {
            position: relative;
            margin: auto;
            height: 250px;
            width: 100%;
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <label for="lang-picker" style="font-size: 12px; margin-bottom: 2px;" id="lbl-lang">Language / اللغة:</label>
            <select id="lang-picker" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="tr">Türkçe</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </div>
        <div id="user-display" style="display:none; color: #ffeb3b; font-size: 14px;">
            <span id="txt-welcome">مرحباً</span>: <span id="pi_username">...</span>
        </div>
    </div>

    <h1 id="main-title">النظام المحاسبي الذكي
