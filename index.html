<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر الرائد - Pi Store</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:system-ui;background:#1a0030;color:#fff;margin:0;padding:10px}
.container{max-width:900px;margin:auto;background:#fff;color:#222;padding:15px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{border:1px solid #ddd;border-radius:12px;padding:10px;text-align:center}
.btn{padding:8px 12px;border:none;border-radius:20px;font-weight:700;cursor:pointer}
.btn-pi{background:#ffd700;color:#1a0030}.btn-w{background:#25D366;color:#fff}
.cart{position:sticky;bottom:0;background:#fff;border-top:2px solid #6a1b9a;padding:10px;border-radius:12px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h2 id="store-title">متجر الرائد</h2>
<p id="store-desc"></p>
<p>صاحب المتجر: <b id="owner"></b></p>
<div id="products" class="grid"></div>
<div class="cart">
<h4>سلة: <span id="cart-total">0</span> Pi</h4>
<div id="cart-items"></div>
<input id="cust-name" placeholder="اسمك">
<input id="cust-phone" placeholder="واتساب 967...">
<button class="btn btn-pi" id="btn-order" style="width:100%">إرسال الطلب للتاجر</button>
<button class="btn btn-w" id="btn-wa-order" style="width:100%;margin-top:5px">إرسال واتساب</button>
</div>
</div>
<script>
let params=new URLSearchParams(location.search);
let owner=params.get('user')||'guest';
document.getElementById('owner').textContent='@'+owner;
function getData(k,def){try{return JSON.parse(localStorage.getItem(k+'_'+owner)||JSON.stringify(def));}catch(e){return def;}}
function setData(k,v){localStorage.setItem(k+'_'+owner, JSON.stringify(v));}
let inv=getData('inv2',[]);
let storeInfo=getData('storeInfo',{name:'',desc:''});
document.getElementById('store-title').textContent=storeInfo.name||('متجر @'+owner);
document.getElementById('store-desc').textContent=storeInfo.desc||'';
let cart=[];let total=0;
function renderProducts(){
 let box=document.getElementById('products');
 if(!inv.length){box.innerHTML='لا يوجد منتجات';return;}
 box.innerHTML=inv.map((p,i)=>'<div class="item"><div style="height:80px;background:#eee;display:flex;align-items:center;justify-content:center;border-radius:8px">'+(p.img?'<img src="'+p.img+'" style="max-height:80px">':'📦')+'</div><b>'+p.name+'</b><br><b>'+p.price+' Pi</b><br>متوفر: '+p.qty+'<br><button class="btn btn-pi" onclick="addCart('+i+')">أضف</button></div>').join('');
}
window.addCart=function(i){
 let p=inv[i];
 if(p.qty<=0){alert('نفد');return;}
 cart.push({name:p.name,price:p.price,qty:1});
 total+=p.price;
 updateCart();
}
function updateCart(){
 document.getElementById('cart-total').textContent=total.toFixed(3);
 document.getElementById('cart-items').innerHTML=cart.map(c=>c.name+' x'+c.qty+' = '+(c.price*c.qty).toFixed(3)+' Pi').join('<br>');
}
document.getElementById('btn-order').addEventListener('click',function(){
 if(!cart.length){alert('السلة فارغة');return;}
 let cust=document.getElementById('cust-name').value||'زبون';
 let orders=getData('orders_v3',[]);
 orders.push({id:Date.now(),customer:cust,items:JSON.parse(JSON.stringify(cart)),total:total,date:new Date().toLocaleString()});
 setData('orders_v3',orders);
 alert('تم إرسال طلبك للتاجر');
 cart=[];total=0;updateCart();
});
document.getElementById('btn-wa-order').addEventListener('click',function(){
 if(!cart.length){alert('السلة فارغة');return;}
 let cust=document.getElementById('cust-name').value||'زبون';
 let text='*طلب جديد من متجر @'+owner+'*%0Aالعميل: '+cust+'%0A%0A'+cart.map(c=>c.name+' x'+c.qty+' = '+(c.price*c.qty).toFixed(3)+' Pi').join('%0A')+'%0A%0A*الإجمالي: '+total.toFixed(3)+' Pi*';
 window.open('https://wa.me/?text='+text,'_blank');
});
try{Pi.init({version:'2.0',sandbox:true});}catch(e){}
renderProducts();
</script>
</body>
</html>
