function defaultTree(){return [{id:'1',code:'1000',name:'Assets',parent:null,type:'asset'},{id:'11',code:'1100',name:'Current',parent:'1',type:'asset'},{id:'111',code:'1101',name:'Cash - Pi',parent:'11',type:'asset'},{id:'112',code:'1102',name:'Bank',parent:'11',type:'asset'},{id:'2',code:'2000',name:'Liabilities',parent:null,type:'liability'},{id:'3',code:'3000',name:'Equity',parent:null,type:'equity'},{id:'31',code:'3001',name:'Capital',parent:'3',type:'equity'},{id:'4',code:'4000',name:'Income',parent:null,type:'income'},{id:'41',code:'4100',name:'Sales',parent:'4',type:'income'},{id:'5',code:'5000',name:'Expenses',parent:null,type:'expense'},{id:'51',code:'5100',name:'Rent',parent:'5',type:'expense'}];}
function checkSetup(){if(!accounts||!sysConfig){document.getElementById('setup-modal').style.display='flex';}else{document.getElementById('setup-modal').style.display='none';}}
function renderTree(){if(!accounts) return;let html='';function node(pid,d){accounts.filter(a=>a.parent===pid).forEach(acc=>{let debit=ledger.filter(x=>x.debitId===acc.id).reduce((s,x)=>s+x.amount,0);let credit=ledger.filter(x=>x.creditId===acc.id).reduce((s,x)=>s+x.amount,0);html+=`<div class="tree-item"><div><b>${acc.code}</b> ${acc.name} (${(debit-credit).toFixed(1)})</div><div><button onclick="window.delAcc('${acc.id}')" style="background:none;border:none;color:red">x</button></div></div>`;node(acc.id,d+1);});}node(null,1);document.getElementById('tree-container').innerHTML=html;let opts=accounts.map(a=>`<option value="${a.id}">${a.code} - ${a.name}</option>`).join('');document.getElementById('acc-parent').innerHTML='<option value="">Root</option>'+opts;document.getElementById('e-debit').innerHTML=opts;document.getElementById('e-credit').innerHTML=opts;document.getElementById('v-account').innerHTML=opts;document.getElementById('ledger-account-select').innerHTML=opts;}
window.delAcc=function(id){if(accounts.some(a=>a.parent===id)) return alert('Has children');if(ledger.some(x=>x.debitId===id||x.creditId===id)) return alert('Has entries');accounts=accounts.filter(a=>a.id!==id);setData('accounts_v4', accounts);renderAll();};function renderLedger(){document.getElementById('ledger-body').innerHTML=ledger.slice(-50).reverse().map(x=>{let dAcc=accounts.find(a=>a.id===x.debitId);let cAcc=accounts.find(a=>a.id===x.creditId);return `<tr><td>${x.date}</td><td>${dAcc?dAcc.name:x.debitCode}</td><td>${cAcc?cAcc.name:x.creditCode}</td><td>${x.desc}</td><td>${x.amount}</td></tr>`;}).join('');}
function renderAccountLedger(){let accId=document.getElementById('ledger-account-select').value;if(!accId) return;let filtered=ledger.filter(x=>x.debitId===accId||x.creditId===accId);let running=0;let rows='';filtered.forEach(x=>{let isDebit=x.debitId===accId;let debit=isDebit?x.amount:0;let credit=isDebit?0:x.amount;let acc=accounts.find(a=>a.id===accId);if(acc&&(acc.type==='asset'||acc.type==='expense')){running+=debit-credit;}else{running+=credit-debit;}rows+=`<tr><td>${x.date}</td><td>${x.desc}</td><td>${debit?debit.toFixed(2):'-'}</td><td>${credit?credit.toFixed(2):'-'}</td><td>${running.toFixed(2)}</td></tr>`;});document.getElementById('account-ledger-body').innerHTML=rows;document.getElementById('account-ledger-balance').innerHTML=`<div style="background:${running>=0?'#e8f5e9':'#ffebee'};padding:8px;border-radius:6px;text-align:center;font-weight:700">Balance: ${running.toFixed(3)}</div>`;}
function renderCustomerSelect(){let customers=[...new Set(invoices.map(i=>i.customer).concat(vouchers.map(v=>v.fromto)))].filter(Boolean);let sel=document.getElementById('customer-select');sel.innerHTML='<option value="">Select</option>'+customers.map(c=>`<option value="${c}">${c}</option>`).join('');}
function renderCustomerStatement(){let cust=document.getElementById('customer-select').value;if(!cust) return;let custInvoices=invoices.filter(i=>i.customer===cust);let custVouchers=vouchers.filter(v=>v.fromto===cust);let all=[];custInvoices.forEach(inv=>{all.push({date:inv.date, type:'Invoice', desc:'Invoice #'+inv.id, debit:inv.total, credit:0});});custVouchers.forEach(v=>{if(v.type==='receipt'){all.push({date:v.date, type:'Receipt', desc:v.desc, debit:0, credit:v.amount});}else{all.push({date:v.date, type:'Payment', desc:v.desc, debit:v.amount, credit:0});}});all.sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=0;let rows=all.map(r=>{bal+=r.debit-r.credit;return `<tr><td>${r.date}</td><td>${r.type}</td><td>${r.desc}</td><td>${r.debit?r.debit.toFixed(2):'-'}</td><td>${r.credit?r.credit.toFixed(2):'-'}</td><td>${bal.toFixed(2)}</td></tr>`;}).join('');document.getElementById('customer-ledger-body').innerHTML=rows;document.getElementById('customer-summary').innerHTML=`<div>Balance: ${bal.toFixed(2)}</div>`;}
function renderVouchers(){let box=document.getElementById('vouchers-list');if(vouchers.length===0){box.innerHTML='No vouchers';return;}box.innerHTML=vouchers.slice(-30).reverse().map(v=>`<div style="background:${v.type==='receipt'?'#e8f5e9':'#ffebee'};padding:6px;margin:4px;border-radius:6px"><b>${v.type} #${v.number}</b> ${v.fromto} - ${v.amount}</div>`).join('');}
function renderInv(f){f=f||'';let list=inv.filter(p=>p.name.toLowerCase().includes(f.toLowerCase()));document.getElementById('inv-body').innerHTML=list.map(p=>`<tr><td>${p.name}</td><td>${p.qty}</td><td>${p.price}</td><td><button onclick="window.delInv(${inv.indexOf(p)})">x</button></td></tr>`).join('');document.getElementById('inv-product').innerHTML=inv.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');}
function renderInvoices(){document.getElementById('saved-invoices').innerHTML=invoices.slice(-10).reverse().map(it=>`<div>#${it.id} ${it.customer} ${it.total}</div>`).join('');}
function refreshCur(){document.getElementById('inv-items').innerHTML=curInv.length===0?'Empty':curInv.map((it,idx)=>`<div>${it.name} x${it.qty} <button onclick="window.removeCur(${idx})">x</button></div>`).join('');document.getElementById('inv-total').textContent=invTotal.toFixed(3);}
function updateReports(){let inc=0,exp=0;ledger.forEach(x=>{let a=accounts.find(z=>z.id===x.creditId);if(a&&a.type==='income') inc+=x.amount;let b=accounts.find(z=>z.id===x.debitId);if(b&&b.type==='expense') exp+=x.amount;});document.getElementById('r-inc').textContent=inc.toFixed(2);document.getElementById('r-exp').textContent=exp.toFixed(2);document.getElementById('r-net').textContent=(inc-exp).toFixed(2);}
window.delInv=function(i){inv.splice(i,1);setData('inv2', inv);renderInv();};window.removeCur=function(idx){curInv.splice(idx,1);invTotal=curInv.reduce((s,i)=>s+i.price*i.qty,0);refreshCur();};
function renderAll(){checkSetup();renderTree();renderLedger();renderVouchers();renderCustomerSelect();renderInv();renderInvoices();refreshCur();updateReports();}document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click', function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active');});});
document.getElementById('btn-do-setup').addEventListener('click', function(){let activity=document.getElementById('setup-activity').value;let currency=document.getElementById('setup-currency').value;let capital=parseFloat(document.getElementById('setup-capital').value||0);accounts=defaultTree();sysConfig={activity:activity,currency:currency,capital:capital};setData('accounts_v4', accounts);setData('sysConfig', sysConfig);if(capital>0){let cash=accounts.find(a=>a.code==='1101');let cap=accounts.find(a=>a.code==='3001');ledger.push({date:new Date().toLocaleDateString(), debitId:cash.id, debitCode:cash.code, creditId:cap.id, creditCode:cap.code, amount:capital, desc:'Opening Capital'});setData('ledger_double', ledger);}document.getElementById('setup-modal').style.display='none';renderAll();});
document.getElementById('form-account').addEventListener('submit', function(e){e.preventDefault();let parent=document.getElementById('acc-parent').value||null;let na={id:Date.now().toString(), code:document.getElementById('acc-code').value, name:document.getElementById('acc-name').value, parent:parent, type:document.getElementById('acc-type').value};accounts.push(na);setData('accounts_v4', accounts);renderAll();e.target.reset();});
document.getElementById('form-entry').addEventListener('submit', function(e){e.preventDefault();let dId=document.getElementById('e-debit').value;let cId=document.getElementById('e-credit').value;if(dId===cId) return alert('Same account');let dAcc=accounts.find(a=>a.id===dId);let cAcc=accounts.find(a=>a.id===cId);ledger.push({date:new Date().toLocaleDateString(), debitId:dId, debitCode:dAcc.code, creditId:cId, creditCode:cAcc.code, amount:parseFloat(document.getElementById('e-amount').value), desc:document.getElementById('e-desc').value});setData('ledger_double', ledger);renderAll();e.target.reset();});
document.getElementById('btn-filter-ledger').addEventListener('click', renderAccountLedger);
document.getElementById('btn-filter-customer').addEventListener('click', renderCustomerStatement);
document.getElementById('btn-show-receipt').addEventListener('click', function(){document.getElementById('voucher-form-card').style.display='block';document.getElementById('v-type').value='receipt';document.getElementById('v-number').value=voucherCounter;document.getElementById('v-date').valueAsDate=new Date();});
document.getElementById('btn-show-payment').addEventListener('click', function(){document.getElementById('voucher-form-card').style.display='block';document.getElementById('v-type').value='payment';document.getElementById('v-number').value=voucherCounter;document.getElementById('v-date').valueAsDate=new Date();});
document.getElementById('form-voucher').addEventListener('submit', function(e){e.preventDefault();let type=document.getElementById('v-type').value;let number=document.getElementById('v-number').value||voucherCounter;let date=document.getElementById('v-date').value||new Date().toLocaleDateString();let fromto=document.getElementById('v-fromto').value;let amount=parseFloat(document.getElementById('v-amount').value);let accountId=document.getElementById('v-account').value;let desc=document.getElementById('v-desc').value;let payMethod=document.getElementById('v-payment-method').value;let v={id:Date.now().toString(), type:type, number:number, date:date, fromto:fromto, amount:amount, accountId:accountId, desc:desc, paymentMethod:payMethod};vouchers.push(v);voucherCounter++;setData('vouchers_v1', vouchers);setData('voucherCounter', voucherCounter);let cashAcc=accounts.find(a=>a.code==='1101');let mainAcc=cashAcc;let targetAcc=accounts.find(a=>a.id===accountId);if(targetAcc&&mainAcc){if(type==='receipt'){ledger.push({date:date, debitId:mainAcc.id, debitCode:mainAcc.code, creditId:targetAcc.id, creditCode:targetAcc.code, amount:amount, desc:'Receipt #'+number});}else{ledger.push({date:date, debitId:targetAcc.id, debitCode:targetAcc.code, creditId:mainAcc.id, creditCode:mainAcc.code, amount:amount, desc:'Payment #'+number});}setData('ledger_double', ledger);}renderAll();e.target.reset();document.getElementById('voucher-form-card').style.display='none';});
document.getElementById('form-inv').addEventListener('submit', function(e){e.preventDefault();inv.push({name:document.getElementById('p-name').value, qty:parseInt(document.getElementById('p-qty').value), price:parseFloat(document.getElementById('p-price').value), cost:parseFloat(document.getElementById('p-cost').value||0)});setData('inv2', inv);renderAll();e.target.reset();});
document.getElementById('search-prod').addEventListener('input', function(){renderInv(this.value);});
document.getElementById('btn-add-inv').addEventListener('click', function(){let idx=document.getElementById('inv-product').value;if(idx==='') return;let prod=inv[idx];let q=parseInt(document.getElementById('inv-qty').value||1);curInv.push({name:prod.name, price:prod.price, qty:q});invTotal=curInv.reduce((s,i)=>s+i.price*i.qty,0);refreshCur();});
document.getElementById('btn-save-inv').addEventListener('click', function(){if(curInv.length===0) return;let customer=document.getElementById('inv-customer').value||'عميل';invoices.push({id:Date.now(), customer:customer, items:JSON.parse(JSON.stringify(curInv)), total:invTotal, date:new Date().toLocaleString()});setData('invoices_v23', invoices);let cash=accounts.find(a=>a.code==='1101');let sales=accounts.find(a=>a.code==='4100');if(cash&&sales){ledger.push({date:new Date().toLocaleDateString(), debitId:cash.id, debitCode:cash.code, creditId:sales.id, creditCode:sales.code, amount:invTotal, desc:'Invoice '+customer});setData('ledger_double', ledger);}curInv.forEach(ci=>{let p=inv.find(x=>x.name===ci.name);if(p) p.qty-=ci.qty;});setData('inv2', inv);renderAll();});document.getElementById('btn-excel').addEventListener('click', function(){let ws=XLSX.utils.json_to_sheet(ledger);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ledger');XLSX.writeFile(wb,'ledger.xlsx');});
document.getElementById('btn-report-pdf').addEventListener('click', function(){let jsPDF=window.jspdf.jsPDF;let doc=new jsPDF();doc.text('Trial Balance - '+new Date().toLocaleDateString(),10,10);let y=20;accounts.forEach(acc=>{let d=ledger.filter(x=>x.debitId===acc.id).reduce((s,x)=>s+x.amount,0);let c=ledger.filter(x=>x.creditId===acc.id).reduce((s,x)=>s+x.amount,0);if(d||c){doc.text(acc.code+' '+acc.name+' D:'+d+' C:'+c,10,y);y+=7;if(y>270){doc.addPage();y=10;}}});doc.save('trial.pdf');});
document.getElementById('btn-migrate').addEventListener('click', function(){renderAll();alert('Done '+window._t('balanced'));});
document.getElementById('btn-login').addEventListener('click', async function(){try{if(typeof Pi==='undefined'){alert('Pi Browser only');return;}let auth=await Pi.authenticate(['username'], function(){});currentUser=auth.user.username;localStorage.setItem('pi_current_user', currentUser);accounts=getData('accounts_v4', null);ledger=getData('ledger_double', []);vouchers=getData('vouchers_v1', []);renderAll();}catch(e){alert(e.message);}}});
document.getElementById('btn-logout').addEventListener('click', function(){localStorage.removeItem('pi_current_user');currentUser='guest';renderAll();});
let savedLang=localStorage.getItem('pi_lang')||'ar';
document.getElementById('lang-picker').value=savedLang;
applyLang(savedLang);
document.getElementById('lang-picker').addEventListener('change', function(){applyLang(this.value);});
renderAll();
</script>
