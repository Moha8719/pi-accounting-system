<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#1a0030}

.container{max-width:1150px;margin:auto;background:rgba(255,255,255,.07);padding:12px;border-radius:16px}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:#fff;color:#222;padding:10px;border-radius:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.tab{padding:7px 9px;background:rgba(255,255,255,.15);border-radius:9px;cursor:pointer;font-size:11px;font-weight:700}
.tab.active{background:var(--p);color:#1a0030}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#fff;color:#222;padding:10px;border-radius:10px;margin:6px 0}
.btn{padding:7px 11px;border:none;border-radius:18px;font-weight:700;cursor:pointer;margin:2px;font-size:11px}
.btn-pi{background:var(--p);color:#1a0030}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}.btn-g{background:#eee;color:#333}.btn-red{background:#e53935;color:#fff}
input,select{width:100%;padding:7px;border-radius:7px;border:1.5px solid var(--s);margin:3px 0;box-sizing:border-box;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:5px;border-bottom:1px solid #ddd;font-size:10px}th{background:var(--s);color:#fff}
.badge{background:#e0ffe0;color:#060;padding:3px 7px;border-radius:8px;font-size:10px}
.badge-warn{background:#fff3cd;color:#856404}
.tree-item{padding:5px 9px;border-right:3px solid var(--s);margin:3px 0;background:#f9f9ff;border-radius:0 7px 7px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.tree-item.l1{border-color:#ffd700;background:#fffde7;font-weight:700}.tree-item.l2{margin-right:15px}.tree-item.l3{margin-right:30px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:#fff;color:#222;padding:18px;border-radius:14px;max-width:520px;width:92%;max-height:92vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.debit{border-right:4px solid #4caf50}.credit{border-right:4px solid #f44336}

function renderTree(){
 if(!accounts) return;
 let l=localStorage.getItem('pi_lang')||'ar';
 document.getElementById('total-acc').textContent=accounts.length;
 let html=''; function node(pid,d){ accounts.filter(function(a){return a.parent===pid;}).forEach(function(acc){
  let name=l==='ar'?acc.name:acc.name_en;
  let debitSum=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0);
  let creditSum=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0);
  let bal=debitSum-creditSum;
  html+='<div class="tree-item l'+(d>3?3:d)+'"><div><b>'+acc.code+'</b> '+name+' <small>('+acc.type+' | '+bal.toFixed(2)+')</small></div><div><button onclick="window.delAcc(\''+acc.id+'\')" style="background:none;border:none;color:red">x</button></div></div>';
  node(acc.id,d+1);
 }); }
 node(null,1); document.getElementById('tree-container').innerHTML=html;
 let opts=accounts.map(function(a){ let n=l==='ar'?a.name:a.name_en; return '<option value="'+a.id+'">'+a.code+' - '+n+'</option>'; }).join('');
 document.getElementById('acc-parent').innerHTML='<option value="">Root</option>'+opts;
 document.getElementById('e-debit').innerHTML=opts;
 document.getElementById('e-credit').innerHTML=opts;
}
window.delAcc=function(id){ if(accounts.some(function(a){return a.parent===id;})){ alert('Has children'); return; } if(ledger.some(function(x){return x.debitId===id||x.creditId===id;})){ alert('Account has entries - cannot delete'); return; } accounts=accounts.filter(function(a){return a.id!==id;}); setData('accounts_v4', accounts); renderTree(); renderTrial(); };

function renderLedger(){
 document.getElementById('ledger-body').innerHTML=ledger.slice(-50).reverse().map(function(x){
  let l=localStorage.getItem('pi_lang')||'ar';
  let dAcc=accounts?accounts.find(function(a){return a.id===x.debitId;}):null;
  let cAcc=accounts?accounts.find(function(a){return a.id===x.creditId;}):null;
  let dName=dAcc? (l==='ar'?dAcc.name:dAcc.name_en) : x.debitId;
  let cName=cAcc? (l==='ar'?cAcc.name:cAcc.name_en) : x.creditId;
  return '<tr><td>'+x.date+'</td><td class="debit" style="color:#2e7d32"><b>'+dName+'</b><br><small>'+(x.debitCode||'')+'</small></td><td class="credit" style="color:#c62828"><b>'+cName+'</b><br><small>'+(x.creditCode||'')+'</small></td><td>'+x.desc+'</td><td><b>'+x.amount+'</b></td></tr>';
 }).join('');
}function renderTrial(){
 let box=document.getElementById('trial-report');
 if(!accounts){ box.innerHTML=''; return; }
 let rows='';
 let totalDebit=0, totalCredit=0;
 accounts.forEach(function(acc){
  let debit=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0);
  let credit=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0);
  if(debit===0&&credit===0) return;
  totalDebit+=debit; totalCredit+=credit;
  let name=localStorage.getItem('pi_lang')==='ar'?acc.name:acc.name_en;
  rows+='<tr><td>'+acc.code+'</td><td>'+name+'</td><td>'+debit.toFixed(2)+'</td><td>'+credit.toFixed(2)+'</td><td>'+(debit-credit).toFixed(2)+'</td></tr>';
 });
 let balanced = Math.abs(totalDebit-totalCredit)<0.001;
 let t=window._t;
 document.getElementById('balance-badge').textContent=(balanced? t('balanced') : t('unbalanced'))+' D:'+totalDebit.toFixed(2)+' = C:'+totalCredit.toFixed(2);
 document.getElementById('balance-badge').className= balanced ? 'badge' : 'badge badge-warn';
 box.innerHTML='<h5>ميزان المراجعة / Trial Balance - مدين=دائن</h5><table><thead><tr><th>Code</th><th>Account</th><th>Debit مدين</th><th>Credit دائن</th><th>Balance</th></tr></thead><tbody>'+rows+'<tr style="background:#e8f5e9;font-weight:700"><td></td><td>Total</td><td>'+totalDebit.toFixed(2)+'</td><td>'+totalCredit.toFixed(2)+'</td><td style="color:'+(balanced?'green':'red')+'">'+(balanced?'✅':'⚠️')+'</td></tr></tbody></table>';
}
function renderInv(f){ f=f||''; let list=inv.filter(function(p){return p.name.toLowerCase().includes(f.toLowerCase());}); document.getElementById('inv-body').innerHTML=list.map(function(p){ return '<tr><td>'+p.name+'</td><td>'+p.qty+'</td><td>'+p.price+'</td><td><button onclick="window.delInv('+inv.indexOf(p)+')">x</button></td></tr>'; }).join(''); document.getElementById('inv-product').innerHTML=inv.map(function(p,i){ return '<option value="'+i+'">'+p.name+' - '+p.price+' Pi</option>'; }).join(''); renderStorePreview(); }
function renderInvoicesList(){ let b=document.getElementById('saved-invoices'); if(invoices.length===0){ b.innerHTML='<small>'+window._t('noInvList')+'</small>'; return;} b.innerHTML=invoices.slice(-20).reverse().map(function(it){ return '<div style="border:1px solid #ccc;padding:5px;border-radius:6px;margin:3px 0;background:#fafafa;color:#222"><b>#'+it.id+'</b> '+it.customer+' - '+it.total.toFixed(3)+' Pi <br><small>'+it.date+'</small></div>'; }).join(''); }
function renderStorePreview(){ let p=document.getElementById('store-preview'); p.innerHTML=inv.length===0?'<small>'+window._t('noInv')+'</small>':inv.slice(0,12).map(function(x){ return '<div style="background:#f8f8ff;border:1px solid #ddd;border-radius:8px;padding:6px;text-align:center"><b>'+x.name+'</b><br>'+x.price+' Pi</div>'; }).join(''); }
function refreshCur(){ let el=document.getElementById('inv-items'); el.innerHTML=curInv.length===0?'<small>'+window._t('emptyCart')+'</small>':curInv.map(function(it,idx){ return '<div>'+it.name+' x'+it.qty+' = '+(it.price*it.qty).toFixed(2)+' <button onclick="window.removeCur('+idx+')" style="color:red;background:none;border:none">x</button></div>'; }).join(''); document.getElementById('inv-total').textContent=invTotal.toFixed(3); }
function updateReports(){ let inc=0, exp=0; ledger.forEach(function(x){ let acc=accounts?accounts.find(function(a){return a.id===x.creditId;}):null; if(acc&&acc.type==='income') inc+=x.amount; let acc2=accounts?accounts.find(function(a){return a.id===x.debitId;}):null; if(acc2&&acc2.type==='expense') exp+=x.amount; }); document.getElementById('r-inc').textContent=inc.toFixed(2); document.getElementById('r-exp').textContent=exp.toFixed(2); document.getElementById('r-net').textContent=(inc-exp).toFixed(2); let ctx=document.getElementById('financeChart'); if(chart) chart.destroy(); if(ctx){ chart=new Chart(ctx,{type:'bar',data:{labels:['Income','Expense','Net'],datasets:[{label:'Pi',data:[inc,exp,inc-exp],backgroundColor:['#4caf50','#f44336','#ffd700']}]},options:{responsive:true}}); } renderTrial(); }
function updateUserUI(){ let u=currentUser; let l=localStorage.getItem('pi_lang')||'ar'; let t=I18N[l]||I18N.ar; document.getElementById('user-info').textContent=u==='guest'?t.guest:'@'+u+(isPro?' Pro':''); document.getElementById('btn-login').style.display=u==='guest'?'inline-block':'none'; document.getElementById('btn-logout').style.display=u==='guest'?'none':'inline-block'; document.getElementById('store-link').textContent=location.origin+location.pathname.replace('index.html','')+'store.html?user='+u; document.getElementById('usage-badge').textContent=(isPro?t.pro:t.free)+': '+(accounts?accounts.length:0)+' acc | '+ledger.length+' entries'; }
window.delInv=function(i){ inv.splice(i,1); setData('inv2', inv); renderInv(); updateUserUI(); };
window.removeCur=function(idx){ curInv.splice(idx,1); invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty;},0); refreshCur(); };
function renderAll(){ checkSetup(); renderTree(); renderLedger(); renderInv(); renderInvoicesList(); renderStorePreview(); refreshCur(); updateReports(); updateUserUI(); }

document.querySelectorAll('.tab').forEach(function(tab){ tab.addEventListener('click', function(){ document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');}); document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active');}); tab.classList.add('active'); document.getElementById(tab.dataset.tab).classList.add('active'); }); });

document.getElementById('btn-do-setup').addEventListener('click', function(){
 let activity=document.getElementById('setup-activity').value;
 let currency=document.getElementById('setup-currency').value;
 let capital=parseFloat(document.getElementById('setup-capital').value||0);
 accounts=defaultTree(activity);
 sysConfig={activity:activity,currency:currency,capital:capital,date:new Date().toISOString()};
 setData('accounts_v4', accounts);
 setData('sysConfig', sysConfig);
 if(capital>0){
  let cash=accounts.find(function(a){return a.code==='1101';});
  let cap=accounts.find(function(a){return a.code==='3001';});
  ledger.push({date:new Date().toLocaleDateString(), debitId:cash?cash.id:'111', debitCode:'1101', creditId:cap?cap.id:'31', creditCode:'3001', amount:capital, desc:'رأس المال الافتتاحي / Opening Capital - Double Entry'});
  setData('ledger_double', ledger);
 }
 document.getElementById('setup-modal').style.display='none';
 renderAll();
 alert('✅ '+accounts.length+' accounts created - Double Entry Ready');
});
document.getElementById('btn-reset-setup').addEventListener('click', function(){ if(confirm('Reset tree?')){ accounts=null; sysConfig=null; localStorage.removeItem(k('accounts_v4')); localStorage.removeItem(k('sysConfig')); checkSetup(); } });
document.getElementById('form-account').addEventListener('submit', function(e){ e.preventDefault(); let parent=document.getElementById('acc-parent').value||null; let pAcc=parent?accounts.find(function(a){return a.id===parent;}):null; let lvl=pAcc?pAcc.level+1:1; let na={id:Date.now().toString(), code:document.getElementById('acc-code').value, name:document.getElementById('acc-name').value, name_en:document.getElementById('acc-name').value, parent:parent, type:document.getElementById('acc-type').value, level:lvl}; accounts.push(na); setData('accounts_v4', accounts); renderTree(); renderTrial(); e.target.reset(); });
document.getElementById('form-entry').addEventListener('submit', function(e){
 e.preventDefault();
 let dId=document.getElementById('e-debit').value;
 let cId=document.getElementById('e-credit').value;
 if(dId===cId){ alert('Debit and Credit cannot be same account - المدين والدائن لا يمكن أن يكون نفس الحساب'); return; }
 let dAcc=accounts.find(function(a){return a.id===dId;});
 let cAcc=accounts.find(function(a){return a.id===cId;});
 let amt=parseFloat(document.getElementById('e-amount').value);
 ledger.push({date:new Date().toLocaleDateString(), debitId:dId, debitCode:dAcc?dAcc.code:'', creditId:cId, creditCode:cAcc?cAcc.code:'', amount:amt, desc:document.getElementById('e-desc').value});
 setData('ledger_double', ledger); renderLedger(); updateReports(); updateUserUI(); e.target.reset();
});
document.getElementById('form-inv').addEventListener('submit', function(e){ e.preventDefault(); inv.push({name:document.getElementById('p-name').value, qty:parseInt(document.getElementById('p-qty').value), price:parseFloat(document.getElementById('p-price').value), cost:parseFloat(document.getElementById('p-cost').value||0), img:document.getElementById('p-img').value, cat:document.getElementById('p-cat').value}); setData('inv2', inv); renderInv(); updateUserUI(); e.target.reset(); });
document.getElementById('search-prod').addEventListener('input', function(){ renderInv(this.value); });
document.getElementById('btn-add-inv').addEventListener('click', function(){ let idx=document.getElementById('inv-product').value; let q=parseInt(document.getElementById('inv-qty').value||1); if(idx===''||inv.length===0) return; let prod=inv[idx]; curInv.push({name:prod.name, price:prod.price, qty:q}); invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty;},0); refreshCur(); });
document.getElementById('btn-save-inv').addEventListener('click', function(){
 if(curInv.length===0){ alert(window._t('noInv')); return; }
 let customer=document.getElementById('inv-customer').value||'عميل';
 let data={id:Date.now(), customer:customer, items:JSON.parse(JSON.stringify(curInv)), total:invTotal, date:new Date().toLocaleString()};
 invoices.push(data); setData('invoices_v23', invoices);
 let cash=accounts? accounts.find(function(a){return a.code==='1101';}) : null;
 let sales=accounts? accounts.find(function(a){return a.code==='4100';}) : null;
 if(cash&&sales){
  ledger.push({date:new Date().toLocaleDateString(), debitId:cash.id, debitCode:cash.code, creditId:sales.id, creditCode:sales.code, amount:invTotal, desc:'فاتورة مبيعات '+customer+' / Sales Invoice '+customer});
  setData('ledger_double', ledger);
 }
 curInv.forEach(function(ci){ let p=inv.find(function(x){return x.name===ci.name;}); if(p) p.qty-=ci.qty; });
 setData('inv2', inv); renderInv(); renderLedger(); updateReports(); renderInvoicesList(); updateUserUI(); document.getElementById('invoice-actions').style.display='block';
});
document.getElementById('btn-new-inv').addEventListener('click', function(){ curInv=[]; invTotal=0; refreshCur(); document.getElementById('invoice-actions').style.display='none'; });
document.getElementById('btn-save-store').addEventListener('click', function(){ storeInfo.name=document.getElementById('store-name').value; storeInfo.desc=document.getElementById('store-desc').value; setData('storeInfo', storeInfo); alert(window._t('migrated')); });
document.getElementById('btn-copy-store').addEventListener('click', function(){ navigator.clipboard.writeText(document.getElementById('store-link').textContent).then(function(){alert(window._t('copied'));}); });
document.getElementById('btn-migrate').addEventListener('click', function(){ let old=localStorage.getItem('ledger'); if(old){ try{ let oldArr=JSON.parse(old); oldArr.forEach(function(o){ ledger.push({date:o.date, debitId:'111', debitCode:'1101', creditId:'4100', creditCode:'4100', amount:o.amount, desc:o.desc}); }); setData('ledger_double', ledger); }catch(e){} } renderAll(); alert('Migrated to Double Entry: '+ledger.length); });
document.getElementById('btn-excel').addEventListener('click', function(){ let ws=XLSX.utils.json_to_sheet(ledger); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Ledger'); XLSX.writeFile(wb,'ledger_double.xlsx'); });
document.getElementById('btn-report-pdf').addEventListener('click', function(){ let jsPDF=window.jspdf.jsPDF; let doc=new jsPDF(); doc.text('Trial Balance',10,10); let y=20; accounts.forEach(function(acc){ let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); if(d||c){ doc.text(acc.code+' '+acc.name+' D:'+d+' C:'+c,10,y); y+=7; } }); doc.save('trial.pdf'); });
document.getElementById('btn-login').addEventListener('click', async function(){ try{ if(typeof Pi==='undefined'){ alert('Open Pi Browser'); return;} let auth=await Pi.authenticate(['username','payments'], function(){}); currentUser=auth.user.username; localStorage.setItem('pi_current_user', currentUser); accounts=getData('accounts_v4', null); ledger=getData('ledger_double', []); inv=getData('inv2',[]); sysConfig=getData('sysConfig', null); renderAll(); }catch(e){ alert(e.message);} });
document.getElementById('btn-logout').addEventListener('click', function(){ localStorage.removeItem('pi_current_user'); currentUser='guest'; accounts=getData('accounts_v4', null); ledger=getData('ledger_double', []); sysConfig=getData('sysConfig', null); renderAll(); });

let savedLang=localStorage.getItem('pi_lang')||'ar';
document.getElementById('lang-picker').value=savedLang;
applyLang(savedLang);
document.getElementById('lang-picker').addEventListener('change', function(){ applyLang(this.value); });
renderAll();
});
</script>
