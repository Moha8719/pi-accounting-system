<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Merchant OS v2.3 Full</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#2e004a}
body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:10px}
.container{max-width:1000px;margin:auto;background:rgba(255,255,255,.08);padding:15px;border-radius:16px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.tab{padding:8px 12px;background:rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.tab.active{background:var(--p);color:#2e004a}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:8px 0}
.btn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin:3px}
.btn-pi{background:var(--p);color:#2e004a}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}.btn-g{background:#eee;color:#333}
input,select{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--s);margin:4px 0;box-sizing:border-box}
table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;font-size:13px}th{background:var(--s);color:#fff}
.badge{background:#e0ffe0;color:#0a0;padding:4px 8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;justify-content:space-between">
<div>Pi Merchant OS v2.3 FULL</div>
<select id="lang-picker" style="width:auto"><option value="ar">العربية</option><option value="en">English</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select>
</div>
<h2 id="main-title" style="text-align:center;color:var(--p)">نظام التاجر الذكي</h2>
<div class="tabs">
<div class="tab active" data-tab="entry" id="lb-entry">قيد</div>
<div class="tab" data-tab="invoice" id="lb-inv">فاتورة</div>
<div class="tab" data-tab="inventory" id="lb-stock">مخزون</div>
<div class="tab" data-tab="partners" id="lb-part">عملاء</div>
<div class="tab" data-tab="reports" id="lb-rep">تقارير</div>
<div class="tab" data-tab="pay" id="lb-pay">Pi</div>
</div>

<div id="entry" class="tab-content active"><div class="card"><h3 id="h-entry">إضافة قيد</h3><form id="form-entry"><select id="e-type"><option value="income" id="op-inc">إيراد</option><option value="expense" id="op-exp">مصروف</option><option value="asset" id="op-ast">أصل</option></select><input id="e-amount" type="number" step="0.0001" placeholder="المبلغ" required><input id="e-desc" placeholder="الوصف" required><button class="btn btn-pi" type="submit" id="btn-save-entry">حفظ</button></form></div><div class="card"><table><tbody id="ledger-body"></tbody></table></div></div>

<div id="invoice" class="tab-content">
<div class="card">
<h3 id="h-inv">إنشاء فاتورة - جديد</h3>
<input id="inv-customer" placeholder="اسم العميل">
<select id="inv-product"></select>
<input id="inv-qty" type="number" value="1" min="1">
<button class="btn btn-pi" type="button" id="btn-add-inv">إضافة للفاتورة</button>
<div id="inv-items" style="margin:10px 0;background:#f9f9f9;padding:8px;border-radius:8px;min-height:20px"></div>
<h4><span id="lb-total">الإجمالي</span>: <span id="inv-total">0</span> π</h4>
<button class="btn btn-pi" type="button" id="btn-save-inv" style="width:100%;font-size:16px">💾 حفظ الفاتورة</button>
<div id="invoice-actions" style="display:none;margin-top:12px;border-top:2px dashed #6a1b9a;padding-top:10px">
<span class="badge">✓ تم الحفظ</span>
<button class="btn btn-s" type="button" id="btn-pdf-last">PDF</button>
<button class="btn btn-w" type="button" id="btn-wa-last">WhatsApp</button>
<button class="btn btn-g" type="button" id="btn-new-inv">+ فاتورة جديدة</button>
</div>
</div>
<div class="card"><h4 id="h-saved">الفواتير المحفوظة</h4><div id="saved-invoices"></div></div>
</div>

<div id="inventory" class="tab-content"><div class="card"><form id="form-inv"><input id="p-name" placeholder="اسم المنتج" required><input id="p-qty" type="number" placeholder="الكمية" required><input id="p-price" type="number" step="0.0001" placeholder="سعر البيع" required><input id="p-cost" type="number" step="0.0001" placeholder="التكلفة"><button class="btn btn-pi" type="submit" id="btn-add-prod">إضافة منتج</button></form></div><div class="card"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Barcode</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>

<div id="partners" class="tab-content"><div class="card"><form id="form-part"><input id="pt-name" placeholder="الاسم" required><select id="pt-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select><input id="pt-phone" placeholder="967..."><button class="btn btn-pi" type="submit">حفظ</button></form></div><div class="card"><table><tbody id="pt-body"></tbody></table></div></div>

<div id="reports" class="tab-content"><div class="card"><p><span id="lb-inc">إيراد</span>: <span id="r-inc">0</span> | <span id="lb-exp">مصروف</span>: <span id="r-exp">0</span> | <b id="lb-net">صافي</b>: <b id="r-net">0</b></p><div style="background:#fff;padding:8px;border-radius:8px"><canvas id="financeChart"></canvas></div><button class="btn btn-s" type="button" id="btn-excel">Excel</button><button class="btn btn-s" type="button" id="btn-report-pdf">PDF</button></div></div>

<div id="pay" class="tab-content"><div class="card"><input id="pay_amount" type="number" value="1"><button class="btn btn-pi" type="button" id="btn-pi-pay">Pay with Pi</button><div id="pi-status"></div></div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
const T={ar:{main:'نظام التاجر الذكي',e:'قيد',inv:'فاتورة',stock:'مخزون',part:'عملاء',rep:'تقارير',pay:'Pi',hE:'إضافة قيد',hI:'إنشاء فاتورة - جديد',save:'حفظ',inc:'إيراد',exp:'مصروف',ast:'أصل',total:'الإجمالي',addInv:'إضافة للفاتورة',addProd:'إضافة منتج',income:'إيراد',expense:'مصروف',net:'صافي',saved:'الفواتير المحفوظة'},en:{main:'Smart Merchant System',e:'Entry',inv:'Invoice',stock:'Stock',part:'Partners',rep:'Reports',pay:'Pi',hE:'Add Entry',hI:'Create Invoice - New',save:'Save',inc:'Income',exp:'Expense',ast:'Asset',total:'Total',addInv:'Add to Invoice',addProd:'Add Product',income:'Income',expense:'Expense',net:'Net',saved:'Saved Invoices'},tr:{main:'Akıllı Tüccar Sistemi',e:'Kayıt',inv:'Fatura',stock:'Stok',part:'Ortaklar',rep:'Raporlar',pay:'Pi',hE:'Kayıt Ekle',hI:'Fatura Oluştur - Yeni',save:'Kaydet',inc:'Gelir',exp:'Gider',ast:'Varlık',total:'Toplam',addInv:'Faturaya Ekle',addProd:'Ürün Ekle',income:'Gelir',expense:'Gider',net:'Net',saved:'Kaydedilen'},zh:{main:'智能商家系统',e:'分录',inv:'发票',stock:'库存',part:'合作伙伴',rep:'报告',pay:'Pi',hE:'添加分录',hI:'创建发票 - 新',save:'保存',inc:'收入',exp:'支出',ast:'资产',total:'总计',addInv:'添加到发票',addProd:'添加产品',income:'收入',expense:'支出',net:'净额',saved:'已保存'},ja:{main:'スマートマーチャント',e:'仕訳',inv:'請求書',stock:'在庫',part:'パートナー',rep:'レポート',pay:'Pi',hE:'仕訳追加',hI:'請求書作成 - 新',save:'保存',inc:'収入',exp:'経費',ast:'資産',total:'合計',addInv:'請求書に追加',addProd:'商品追加',income:'収入',expense:'経費',net:'純利益',saved:'保存済み'},vi:{main:'Hệ thống thương nhân',e:'Bút toán',inv:'Hóa đơn',stock:'Kho',part:'Đối tác',rep:'Báo cáo',pay:'Pi',hE:'Thêm bút toán',hI:'Tạo hóa đơn - Mới',save:'Lưu',inc:'Thu nhập',exp:'Chi phí',ast:'Tài sản',total:'Tổng',addInv:'Thêm vào HĐ',addProd:'Thêm SP',income:'Thu nhập',expense:'Chi phí',net:'Ròng',saved:'Đã lưu'},fr:{main:'Système Marchand',e:'Écriture',inv:'Facture',stock:'Stock',part:'Partenaires',rep:'Rapports',pay:'Pi',hE:'Ajouter',hI:'Créer Facture - Nouveau',save:'Enregistrer',inc:'Revenu',exp:'Dépense',ast:'Actif',total:'Total',addInv:'Ajouter',addProd:'Ajouter Produit',income:'Revenu',expense:'Dépense',net:'Net',saved:'Enregistrées'},de:{main:'Händler System',e:'Buchung',inv:'Rechnung',stock:'Lager',part:'Partner',rep:'Berichte',pay:'Pi',hE:'Buchung',hI:'Rechnung - Neu',save:'Speichern',inc:'Einnahme',exp:'Ausgabe',ast:'Anlage',total:'Gesamt',addInv:'Hinzufügen',addProd:'Produkt',income:'Einnahme',expense:'Ausgabe',net:'Netto',saved:'Gespeichert'},es:{main:'Sistema Comerciante',e:'Asiento',inv:'Factura',stock:'Inventario',part:'Socios',rep:'Informes',pay:'Pi',hE:'Añadir',hI:'Crear Factura - Nuevo',save:'Guardar',inc:'Ingreso',exp:'Gasto',ast:'Activo',total:'Total',addInv:'Añadir',addProd:'Añadir Producto',income:'Ingreso',expense:'Gasto',net:'Neto',saved:'Guardadas'}};

function applyLang(l){
 var t=T[l]||T.en;
 document.documentElement.lang=l;
 document.documentElement.dir=(l==='ar')?'rtl':'ltr';
 document.getElementById('main-title').textContent=t.main;
 document.getElementById('lb-entry').textContent=t.e;
 document.getElementById('lb-inv').textContent=t.inv;
 document.getElementById('lb-stock').textContent=t.stock;
 document.getElementById('lb-part').textContent=t.part;
 document.getElementById('lb-rep').textContent=t.rep;
 document.getElementById('lb-pay').textContent=t.pay;
 document.getElementById('h-entry').textContent=t.hE;
 document.getElementById('h-inv').textContent=t.hI;
 document.getElementById('btn-save-entry').textContent=t.save;
 document.getElementById('btn-add-inv').textContent=t.addInv;
 document.getElementById('btn-add-prod').textContent=t.addProd;
 document.getElementById('op-inc').textContent=t.inc;
 document.getElementById('op-exp').textContent=t.exp;
 document.getElementById('op-ast').textContent=t.ast;
 document.getElementById('lb-total').textContent=t.total;
 document.getElementById('lb-inc').textContent=t.income;
 document.getElementById('lb-exp').textContent=t.expense;
 document.getElementById('lb-net').textContent=t.net;
 document.getElementById('h-saved').textContent=t.saved;
 localStorage.setItem('erp_lang',l);
}
var picker=document.getElementById('lang-picker');
var savedLang=localStorage.getItem('erp_lang')||'ar';
picker.value=savedLang;
applyLang(savedLang);
picker.addEventListener('change',function(){applyLang(this.value);});

var ledger=JSON.parse(localStorage.getItem('ledger')||'[]');
var inv=JSON.parse(localStorage.getItem('inv2')||'[]');
var partners=JSON.parse(localStorage.getItem('partners2')||'[]');
var invoices=JSON.parse(localStorage.getItem('invoices_v23')||'[]');
var curInv=[];var invTotal=0;var lastSavedInvoice=null;var chart=null;

document.querySelectorAll('.tab').forEach(function(tab){
 tab.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
  document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active')});
  tab.classList.add('active');
  document.getElementById(tab.dataset.tab).classList.add('active');
 });
});

function renderLedger(){
 document.getElementById('ledger-body').innerHTML=ledger.slice(-20).reverse().map(function(l){return '<tr><td>'+l.date+'</td><td>'+l.desc+'</td><td>'+l.type+'</td><td>'+l.amount+'</td></tr>';}).join('');
}
function renderInv(){
 document.getElementById('inv-body').innerHTML=inv.map(function(p,i){return '<tr><td>'+p.name+'</td><td>'+p.qty+'</td><td>'+p.price+'</td><td><svg id="bc'+i+'"></svg></td><td><button type="button" onclick="window.delInv('+i+')">x</button></td></tr>';}).join('');
 document.getElementById('inv-product').innerHTML=inv.map(function(p,i){return '<option value="'+i+'">'+p.name+' - '+p.price+' Pi (Qty:'+p.qty+')</option>';}).join('');
 setTimeout(function(){inv.forEach(function(p,i){try{JsBarcode('#bc'+i,p.name.substring(0,8)+i,{width:1,height:18,displayValue:false});}catch(e){}});},300);
}
function renderPartners(){
 document.getElementById('pt-body').innerHTML=partners.map(function(p){return '<tr><td>'+p.name+'</td><td>'+p.type+'</td><td>'+p.phone+'</td><td><a class="btn btn-w" target="_blank" href="https://wa.me/'+p.phone+'">WA</a></td></tr>';}).join('');
}
window.delInv=function(i){inv.splice(i,1);localStorage.setItem('inv2',JSON.stringify(inv));renderInv();};

function renderInvoicesList(){
 var box=document.getElementById('saved-invoices');
 if(invoices.length===0){box.innerHTML='<small>لا يوجد فواتير بعد</small>';return;}
 box.innerHTML=invoices.slice(-20).reverse().map(function(it){
  return '<div style="border:1px solid #ccc;padding:8px;border-radius:8px;margin:5px 0;background:#fafafa;color:#222"><b>#'+it.id+'</b> - '+it.customer+' - <b>'+it.total.toFixed(3)+' Pi</b><br><small>'+it.date+'</small><br>'+it.items.map(function(j){return j.name+' x'+j.qty}).join(', ')+'<br><button class="btn btn-s" type="button" onclick="window.pdfInvoice('+it.id+')">PDF</button><button class="btn btn-w" type="button" onclick="window.waInvoice('+it.id+')">WhatsApp</button></div>';
 }).join('');
}

function updateReports(){
 var inc=ledger.filter(function(x){return x.type==='income'}).reduce(function(s,x){return s+x.amount},0);
 var exp=ledger.filter(function(x){return x.type==='expense'}).reduce(function(s,x){return s+x.amount},0);
 document.getElementById('r-inc').textContent=inc.toFixed(2);
 document.getElementById('r-exp').textContent=exp.toFixed(2);
 document.getElementById('r-net').textContent=(inc-exp).toFixed(2);
 var ctx=document.getElementById('financeChart');
 if(!ctx) return;
 if(chart) chart.destroy();
 chart=new Chart(ctx,{
  type:'bar',
  data:{
   labels:['Income','Expense','Net'],
   datasets:[{
    label:'Pi',
    data:[inc,exp,inc-exp],
    backgroundColor:['#4caf50','#f44336','#ffd700']
   }]
  },
  options:{
   responsive:true,
   plugins:{legend:{display:false}}
  }
 });
}

document.getElementById('form-entry').addEventListener('submit',function(e){
 e.preventDefault();
 ledger.push({date:new Date().toLocaleDateString(),type:document.getElementById('e-type').value,amount:parseFloat(document.getElementById('e-amount').value),desc:document.getElementById('e-desc').value});
 localStorage.setItem('ledger',JSON.stringify(ledger));
 renderLedger();updateReports();e.target.reset();
});
document.getElementById('form-inv').addEventListener('submit',function(e){
 e.preventDefault();
 inv.push({name:document.getElementById('p-name').value,qty:parseInt(document.getElementById('p-qty').value),price:parseFloat(document.getElementById('p-price').value),cost:parseFloat(document.getElementById('p-cost').value||0)});
 localStorage.setItem('inv2',JSON.stringify(inv));
 renderInv();e.target.reset();
});
document.getElementById('form-part').addEventListener('submit',function(e){
 e.preventDefault();
 partners.push({name:document.getElementById('pt-name').value,type:document.getElementById('pt-type').value,phone:document.getElementById('pt-phone').value});
 localStorage.setItem('partners2',JSON.stringify(partners));
 renderPartners();e.target.reset();
});

function refreshCurrentInvoiceUI(){
 var el=document.getElementById('inv-items');
 if(curInv.length===0){el.innerHTML='<small>فارغة</small>';}
 else {el.innerHTML=curInv.map(function(it,idx){return '<div>'+it.name+' x'+it.qty+' = '+(it.price*it.qty).toFixed(3)+' Pi <button type="button" onclick="window.removeCur('+idx+')" style="color:red;border:none;background:none">x</button></div>';}).join('');}
 document.getElementById('inv-total').textContent=invTotal.toFixed(3);
}
window.removeCur=function(idx){curInv.splice(idx,1);invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty},0);refreshCurrentInvoiceUI();};

document.getElementById('btn-add-inv').addEventListener('click',function(){
 var idx=document.getElementById('inv-product').value;
 var q=parseInt(document.getElementById('inv-qty').value||1);
 if(idx==='') return;
 var prod=inv[idx];
 if(prod.qty<q){alert('الكمية غير متوفرة، المتوفر: '+prod.qty);return;}
 curInv.push({name:prod.name,price:prod.price,qty:q});
 invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty},0);
 refreshCurrentInvoiceUI();
});

document.getElementById('btn-save-inv').addEventListener('click',function(){
 if(curInv.length===0){alert('أضف منتجات أولاً');return;}
 var customer=document.getElementById('inv-customer').value||'عميل';
 var data={id:Date.now(),customer:customer,items:JSON.parse(JSON.stringify(curInv)),total:invTotal,date:new Date().toLocaleString()};
 invoices.push(data);
 lastSavedInvoice=data;
 localStorage.setItem('invoices_v23',JSON.stringify(invoices));
 ledger.push({date:new Date().toLocaleDateString(),type:'income',amount:invTotal,desc:'فاتورة '+customer});
 curInv.forEach(function(ci){var p=inv.find(function(x){return x.name===ci.name});if(p)p.qty-=ci.qty;});
 localStorage.setItem('ledger',JSON.stringify(ledger));
 localStorage.setItem('inv2',JSON.stringify(inv));
 renderInv();renderLedger();updateReports();renderInvoicesList();
 document.getElementById('invoice-actions').style.display='block';
 document.getElementById('btn-save-inv').disabled=true;
 document.getElementById('btn-save-inv').textContent='✓ تم الحفظ';
});

document.getElementById('btn-new-inv').addEventListener('click',function(){
 curInv=[];invTotal=0;lastSavedInvoice=null;
 refreshCurrentInvoiceUI();
 document.getElementById('invoice-actions').style.display='none';
 document.getElementById('btn-save-inv').disabled=false;
 document.getElementById('btn-save-inv').textContent='💾 حفظ الفاتورة';
 document.getElementById('inv-customer').value='';
});

function makePdf(d){
 var jsPDF=window.jspdf.jsPDF;
 var doc=new jsPDF();
 doc.text('Pi Merchant - Invoice #'+d.id,10,10);
 doc.text('Customer: '+d.customer,10,18);
 doc.text('Date: '+d.date,10,26);
 var y=36;
 d.items.forEach(function(it){
  doc.text(it.name+' x'+it.qty+' = '+(it.price*it.qty).toFixed(3)+' Pi',10,y);
  y+=8;
 });
 doc.text('Total: '+d.total.toFixed(3)+' Pi',10,y+10);
 return doc;
}

document.getElementById('btn-pdf-last').addEventListener('click',function(){if(!lastSavedInvoice)return;makePdf(lastSavedInvoice).save('invoice-'+lastSavedInvoice.id+'.pdf');});
document.getElementById('btn-wa-last').addEventListener('click',function(){if(!lastSavedInvoice)return;window.waInvoice(lastSavedInvoice.id);});

window.pdfInvoice=function(id){
 var d=invoices.find(function(x){return x.id===id});
 if(!d) return;
 makePdf(d).save('invoice-'+id+'.pdf');
};
window.waInvoice=function(id){
 var d=invoices.find(function(x){return x.id===id});
 if(!d) return;
 var text='*فاتورة #'+d.id+'*%0Aالعميل: '+d.customer+'%0Aالتاريخ: '+d.date+'%0A%0A'+d.items.map(function(i){return i.name+' x'+i.qty+' = '+(i.price*i.qty).toFixed(3)+' Pi'}).join('%0A')+'%0A%0A*الإجمالي: '+d.total.toFixed(3)+' Pi*';
 window.open('https://wa.me/?text='+text,'_blank');
};

document.getElementById('btn-excel').addEventListener('click',function(){
 var ws=XLSX.utils.json_to_sheet(ledger);
 var wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Ledger');
 XLSX.writeFile(wb,'ledger.xlsx');
});
document.getElementById('btn-report-pdf').addEventListener('click',function(){
 var jsPDF=window.jspdf.jsPDF;
 var doc=new jsPDF();
 doc.text('Report',10,10);
 doc.text('Income '+document.getElementById('r-inc').textContent,10,20);
 doc.text('Expense '+document.getElementById('r-exp').textContent,10,30);
 doc.save('report.pdf');
});

try{if(typeof Pi!=='undefined'){Pi.init({version:'2.0',sandbox:true});}}catch(e){}
renderLedger();renderInv();renderPartners();updateReports();renderInvoicesList();refreshCurrentInvoiceUI();
});
</script>
</body>
  </html>
