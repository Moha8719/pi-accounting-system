<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Business OS v3.9 - 10 Languages + Ledger + Customer Statement</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#1a0030;--green:#2e7d32;--red:#c62828}
body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:6px;font-size:13px}
.container{max-width:1220px;margin:auto;background:rgba(255,255,255,.07);padding:10px;border-radius:14px}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;background:#fff;color:#222;padding:9px;border-radius:10px}
.tabs{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.tab{padding:6px 7px;background:rgba(255,255,255,.15);border-radius:8px;cursor:pointer;font-size:9px;font-weight:700}
.tab.active{background:var(--p);color:#1a0030}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#fff;color:#222;padding:9px;border-radius:9px;margin:5px 0}
.btn{padding:6px 9px;border:none;border-radius:16px;font-weight:700;cursor:pointer;margin:2px;font-size:9px}
.btn-pi{background:var(--p);color:#1a0030}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}.btn-g{background:#eee;color:#333}.btn-red{background:#e53935;color:#fff}.btn-green{background:var(--green);color:#fff}
input,select{width:100%;padding:6px;border-radius:6px;border:1.5px solid var(--s);margin:3px 0;box-sizing:border-box;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:4px;border-bottom:1px solid #ddd;font-size:9px}th{background:var(--s);color:#fff}
.badge{padding:2px 6px;border-radius:6px;font-size:9px}.badge-green{background:#e8f5e9;color:var(--green)}.badge-warn{background:#fff3e0;color:#ef6c00}
.tree-item{padding:4px 8px;border-right:3px solid var(--s);margin:2px 0;background:#f9f9ff;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;font-size:11px}
.tree-item.l1{border-color:#ffd700;background:#fffde7;font-weight:700}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:#fff;color:#222;padding:16px;border-radius:12px;max-width:580px;width:93%;max-height:92vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.voucher{border:2px dashed #333;padding:12px;border-radius:10px;background:#fff;color:#222;margin:8px 0}
.statement{background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:10px;margin:6px 0;color:#222}
</style>
</head>
<body>
<div id="setup-modal" class="modal" style="display:none"><div class="modal-box">
<h3 id="setup-title"></h3><p id="setup-desc"></p>
<label id="lb-setup-activity"></label><select id="setup-activity"><option value="store"></option><option value="grocery"></option><option value="stationery"></option><option value="electronics"></option><option value="service"></option></select>
<label id="lb-setup-currency"></label><select id="setup-currency"><option value="Pi">Pi π</option><option value="SAR">SAR</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="CNY">CNY</option><option value="JPY">JPY</option></select>
<label id="lb-setup-capital"></label><input id="setup-capital" type="number" value="1000"><button class="btn btn-pi" id="btn-do-setup" style="width:100%"></button></div></div>

<div class="container">
<div class="header"><div><b id="app-name"></b> <span id="version-badge" style="background:#4caf50;color:#fff;padding:2px 5px;border-radius:5px;font-size:8px"></span><br><small id="user-info"></small><br><small id="currency-badge"></small></div><div style="display:flex;gap:3px;align-items:center"><select id="lang-picker" style="width:auto"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="ru">Русский</option></select><button class="btn btn-red" id="btn-migrate" style="font-size:8px"></button><button class="btn btn-pi" id="btn-login"></button><button class="btn btn-g" id="btn-logout" style="display:none"></button></div></div>

<div class="tabs">
<div class="tab active" data-tab="tree" id="tab-tree"></div><div class="tab" data-tab="entry" id="tab-entry"></div><div class="tab" data-tab="ledger" id="tab-ledger"></div><div class="tab" data-tab="customers" id="tab-customers"></div><div class="tab" data-tab="vouchers" id="tab-vouchers"></div><div class="tab" data-tab="invoice" id="tab-invoice"></div><div class="tab" data-tab="inventory" id="tab-inventory"></div><div class="tab" data-tab="financials" id="tab-financials"></div><div class="tab" data-tab="reports" id="tab-reports"></div>
 </div><div id="tree" class="tab-content active"><div class="card"><h4 id="h-tree"></h4><div id="tree-container"></div><div class="card" style="background:#f5f5ff"><h5 id="h-add-acc-form"></h5><form id="form-account"><div class="row"><input id="acc-code" required><input id="acc-name" required></div><div class="row"><select id="acc-parent"></select><select id="acc-type"><option value="asset"></option><option value="liability"></option><option value="equity"></option><option value="income"></option><option value="expense"></option></select></div><button class="btn btn-pi" type="submit" id="btn-save-acc" style="width:100%"></button></form></div></div></div>
<div id="entry" class="tab-content"><div class="card"><h4 id="h-entry"></h4><p style="font-size:10px;background:#e3f2fd;padding:5px;border-radius:5px" id="entry-help"></p><form id="form-entry"><div class="row"><div><label id="lb-debit" style="color:var(--green);font-weight:700"></label><select id="e-debit"></select></div><div><label id="lb-credit" style="color:var(--red);font-weight:700"></label><select id="e-credit"></select></div></div><div class="row"><input id="e-amount" type="number" step="0.0001" required><input id="e-desc" required></div><button class="btn btn-pi" type="submit" id="btn-save-entry" style="width:100%"></button></form></div><div class="card"><h5 id="h-ledger"></h5><table><thead><tr><th id="th-date"></th><th id="th-debit"></th><th id="th-credit"></th><th id="th-desc"></th><th id="th-amount"></th></tr></thead><tbody id="ledger-body"></tbody></table></div></div>
<div id="ledger" class="tab-content"><div class="card"><h4 id="h-account-ledger"></h4><p id="desc-account-ledger" style="font-size:10px;background:#fff3e0;padding:5px;border-radius:5px"></p><select id="ledger-account-select"></select><div class="row"><input id="ledger-from" type="date"><input id="ledger-to" type="date"></div><button class="btn btn-s" id="btn-filter-ledger" style="width:100%"></button><div id="account-ledger-balance" style="margin:8px 0"></div><div style="overflow:auto"><table><thead><tr><th id="th-l-date"></th><th id="th-l-desc"></th><th id="th-l-debit"></th><th id="th-l-credit"></th><th id="th-l-balance"></th></tr></thead><tbody id="account-ledger-body"></tbody></table></div><div class="row"><button class="btn btn-s" id="btn-export-ledger"></button><button class="btn btn-s" id="btn-print-ledger"></button></div></div></div>
<div id="customers" class="tab-content"><div class="card"><h4 id="h-customers"></h4><p id="desc-customers" style="font-size:10px;background:#e3f2fd;padding:5px;border-radius:5px"></p><select id="customer-select"></select><button class="btn btn-s" id="btn-filter-customer" style="width:100%"></button><div id="customer-summary" style="margin:8px 0"></div><div style="overflow:auto"><table><thead><tr><th id="th-c-date"></th><th id="th-c-type"></th><th id="th-c-desc"></th><th id="th-c-debit"></th><th id="th-c-credit"></th><th id="th-c-balance"></th></tr></thead><tbody id="customer-ledger-body"></tbody></table></div><div class="row"><button class="btn btn-s" id="btn-export-customer"></button><button class="btn btn-s" id="btn-wa-customer"></button></div></div></div>
<div id="vouchers" class="tab-content"><div class="card"><h4 id="h-vouchers"></h4><div class="row"><button class="btn btn-green" id="btn-show-receipt" style="width:100%"></button><button class="btn btn-red" id="btn-show-payment" style="width:100%"></button></div></div><div class="card" id="voucher-form-card" style="display:none"><h5 id="voucher-form-title"></h5><form id="form-voucher"><select id="v-type"></select><div class="row"><input id="v-number"><input id="v-date" type="date"></div><input id="v-fromto"><input id="v-amount" type="number" step="0.0001"><select id="v-account"></select><input id="v-desc"><select id="v-payment-method"></select><button class="btn btn-pi" type="submit" id="btn-save-voucher" style="width:100%"></button></form></div><div class="card"><h5 id="h-vouchers-list"></h5><div id="vouchers-list"></div></div><div class="card" id="voucher-print-area"></div></div>
<div id="invoice" class="tab-content"><div class="card"><h4 id="h-inv"></h4><input id="inv-customer"><select id="inv-product"></select><div class="row"><input id="inv-qty" type="number" value="1"><button class="btn btn-pi" type="button" id="btn-add-inv"></button></div><div id="inv-items"></div><h4><span id="lb-total"></span>: <span id="inv-total">0</span></h4><button class="btn btn-pi" type="button" id="btn-save-inv" style="width:100%"></button></div><div class="card"><div id="saved-invoices"></div></div></div>
<div id="inventory" class="tab-content"><div class="card"><h4 id="h-add-prod"></h4><form id="form-inv"><div class="row"><input id="p-name" required><input id="p-qty" type="number" required></div><div class="row"><input id="p-price" type="number" step="0.0001" required><input id="p-cost" type="number" step="0.0001"></div><button class="btn btn-pi" type="submit" id="btn-add-prod" style="width:100%"></button></form></div><div class="card"><input id="search-prod"><table><thead><tr><th id="th-prod"></th><th id="th-qty"></th><th id="th-price"></th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>
<div id="financials" class="tab-content"><div class="card"><h4 id="h-financials"></h4><div class="row"><button class="btn btn-s" id="btn-gen-income"></button><button class="btn btn-s" id="btn-gen-balance"></button><button class="btn btn-s" id="btn-export-financials"></button></div></div><div class="card"><div id="income-statement" class="statement"></div></div><div class="card"><div id="balance-sheet" class="statement"></div></div></div>

</div>

tr:{dir:"ltr",appName:"Pi Business OS v3.9",badge:"10 dil + Defter",guest:"demo",restore:"🔄 Geri yükle",login:"Pi Giriş",logout:"Çıkış",tabTree:"🌳 Plan",tabEntry:"📒 Çift",tabLedger:"📘 Defter",tabCustomers:"👥 Müşteriler",tabVouchers:"🧾 Makbuz",tabInvoice:"🧾 Fatura",tabInventory:"📦 Stok",tabFinancials:"📊 Finansal",tabReports:"📈 Raporlar",hTree:"Hesap Planı",hAddAcc:"Hesap ekle",code:"Kod",accName:"Hesap adı",parentRoot:"Kök",asset:"Varlık",liability:"Borç",equity:"Öz sermaye",income:"Gelir",expense:"Gider",save:"💾 Kaydet",saveAcc:"+ Hesap ekle",hEntry:"Çift Kayıt",help:"Her kayıt = Borç + Alacak",debit:"● Borç",credit:"● Alacak",amount:"Tutar",de<script>
let currentUser=localStorage.getItem('pi_current_user')||'guest';
let k=function(n){ return n+'_'+currentUser; };
function getData(n,d){ try{ return JSON.parse(localStorage.getItem(k(n))||JSON.stringify(d)); }catch(e){ return d; } }
function setData(n,v){ localStorage.setItem(k(n), JSON.stringify(v)); }
let accounts=getData('accounts_v4', null);
let ledger=getData('ledger_double', []);
let vouchers=getData('vouchers_v1', []);
let inv=getData('inv2',[]); let invoices=getData('invoices_v23',[]); let sysConfig=getData('sysConfig', null);
let curInv=[]; let invTotal=0; let chart=null; let voucherCounter=getData('voucherCounter', 1001);

function defaultTree(){ return [
{id:'1',code:'1000',name:'الأصول',parent:null,type:'asset',level:1},{id:'11',code:'1100',name:'أصول متداولة',parent:'1',type:'asset',level:2},{id:'111',code:'1101',name:'الصندوق - Pi',parent:'11',type:'asset',level:3},{id:'112',code:'1102',name:'البنك',parent:'11',type:'asset',level:3},{id:'113',code:'1103',name:'المخزون',parent:'11',type:'asset',level:3},{id:'12',code:'1200',name:'أصول ثابتة',parent:'1',type:'asset',level:2},{id:'2',code:'2000',name:'الخصوم',parent:null,type:'liability',level:1},{id:'21',code:'2100',name:'موردين',parent:'2',type:'liability',level:2},{id:'3',code:'3000',name:'حقوق الملكية',parent:null,type:'equity',level:1},{id:'31',code:'3001',name:'رأس المال',parent:'3',type:'equity',level:2},{id:'4',code:'4000',name:'الإيرادات',parent:null,type:'income',level:1},{id:'41',code:'4100',name:'مبيعات',parent:'4',type:'income',level:2},{id:'5',code:'5000',name:'المصروفات',parent:null,type:'expense',level:1},{id:'51',code:'5100',name:'إيجار',parent:'5',type:'expense',level:2},{id:'52',code:'5200',name:'كهرباء',parent:'5',type:'expense',level:2},{id:'53',code:'5300',name:'مشتريات',parent:'5',type:'expense',level:2},{id:'54',code:'5400',name:'رواتب',parent:'5',type:'expense',level:2}
];}
function checkSetup(){ if(!accounts||!sysConfig){ document.getElementById('setup-modal').style.display='flex'; }else{ document.getElementById('setup-modal').style.display='none'; document.getElementById('currency-badge').textContent='💰 '+(sysConfig.currency||'Pi'); } }
function renderTree(){
 if(!accounts) return;
 let html=''; function node(pid,d){ accounts.filter(function(a){return a.parent===pid;}).forEach(function(acc){
  let debit=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0);
  let credit=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0);
  html+='<div class="tree-item l'+(d>3?3:d)+'"><div><b>'+acc.code+'</b> '+acc.name+' ('+(debit-credit).toFixed(1)+')</div><div><button onclick="window.delAcc(\''+acc.id+'\')" style="background:none;border:none;color:red">x</button></div></div>';
  node(acc.id,d+1);
 }); } node(null,1); document.getElementById('tree-container').innerHTML=html;
 let opts=accounts.map(function(a){ return '<option value="'+a.id+'">'+a.code+' - '+a.name+'</option>'; }).join('');
 document.getElementById('acc-parent').innerHTML='<option value="">'+window._t('parentRoot')+'</option>'+opts;
 document.getElementById('e-debit').innerHTML=opts; document.getElementById('e-credit').innerHTML=opts;
 document.getElementById('v-account').innerHTML=opts; document.getElementById('ledger-account-select').innerHTML=opts;
}
window.delAcc=function(id){ if(accounts.some(function(a){return a.parent===id;})) return alert('Has children'); if(ledger.some(function(x){return x.debitId===id||x.creditId===id})) return alert('Has entries'); accounts=accounts.filter(function(a){return a.id!==id;}); setData('accounts_v4', accounts); renderAll(); };
function renderLedger(){ document.getElementById('ledger-body').innerHTML=ledger.slice(-50).reverse().map(function(x){ let dAcc=accounts.find(function(a){return a.id===x.debitId;}); let cAcc=accounts.find(function(a){return a.id===x.creditId;}); return '<tr><td>'+x.date+'</td><td style="color:var(--green)"><b>'+(dAcc?dAcc.name:x.debitCode)+'</b></td><td style="color:var(--red)"><b>'+(cAcc?cAcc.name:x.creditCode)+'</b></td><td>'+x.desc+'</td><td>'+x.amount+'</td></tr>'; }).join(''); }

function renderAccountLedger(){
 let accId=document.getElementById('ledger-account-select').value; if(!accId) return;
 let t=window._t;
 let filtered=ledger.filter(function(x){return x.debitId===accId||x.creditId===accId;});
 let from=document.getElementById('ledger-from').value; let to=document.getElementById('ledger-to').value;
 if(from) filtered=filtered.filter(function(x){ return new Date(x.date) >= new Date(from) || x.date >= from; });
 if(to) filtered=filtered.filter(function(x){ return new Date(x.date) <= new Date(to) || x.date <= to; });
 let running=0; let rows='';
 filtered.forEach(function(x){
  let isDebit=x.debitId===accId; let debit=isDebit?x.amount:0; let credit=isDebit?0:x.amount;
  if(accounts.find(function(a){return a.id===accId;})?.type==='asset' || accounts.find(function(a){return a.id===accId;})?.type==='expense'){ running+=debit-credit; }else{ running+=credit-debit; }
  rows+='<tr><td>'+x.date+'</td><td>'+x.desc+'</td><td>'+(debit?debit.toFixed(2):'-')+'</td><td>'+(credit?credit.toFixed(2):'-')+'</td><td style="font-weight:700;background:'+(running>=0?'#e8f5e9':'#ffebee')+'">'+running.toFixed(2)+'</td></tr>';
 });
 document.getElementById('account-ledger-body').innerHTML=rows||'<tr><td colspan="5">'+t('noProducts')+'</td></tr>';
 document.getElementById('account-ledger-balance').innerHTML='<div class="ledger-bal '+(running>=0?'pos':'neg')+'">'+t('thLBalance')+': '+running.toFixed(3)+' '+(sysConfig?sysConfig.currency:'Pi')+'</div>';
}

function renderCustomerSelect(){
 let customers=[...new Set(invoices.map(function(i){return i.customer;}).concat(vouchers.map(function(v){return v.fromto;})))].filter(Boolean);
 let sel=document.getElementById('customer-select'); let t=window._t;
 sel.innerHTML='<option value="">'+t('selectCustomer')+'</option>'+customers.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
}

function renderCustomerStatement(){
 let cust=document.getElementById('customer-select').value; if(!cust) return;
 let t=window._t;
 let custInvoices=invoices.filter(function(i){return i.customer===cust;});
 let custVouchers=vouchers.filter(function(v){return v.fromto===cust;});
 let all=[]; custInvoices.forEach(function(inv){ all.push({date:inv.date, type:'Invoice', desc:t('hInv')+' #'+inv.id, debit:inv.total, credit:0}); });
 custVouchers.forEach(function(v){ if(v.type==='receipt'){ all.push({date:v.date, type:t('vReceipt'), desc:v.desc, debit:0, credit:v.amount}); }else{ all.push({date:v.date, type:t('vPayment'), desc:v.desc, debit:v.amount, credit:0}); } });
 all.sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
 let bal=0, totalInv=0, totalRec=0;
 let rows=all.map(function(r){ bal+=r.debit-r.credit; totalInv+=r.debit; totalRec+=r.credit; return '<tr><td>'+r.date+'</td><td>'+r.type+'</td><td>'+r.desc+'</td><td>'+(r.debit?r.debit.toFixed(2):'-')+'</td><td>'+(r.credit?r.credit.toFixed(2):'-')+'</td><td style="font-weight:700;background:'+(bal>=0?'#e8f5e9':'#ffebee')+'">'+bal.toFixed(2)+'</td></tr>'; }).join('');
 document.getElementById('customer-ledger-body').innerHTML=rows||'<tr><td colspan="6">'+t('noProducts')+'</td></tr>';
 document.getElementById('customer-summary').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><div style="background:#e3f2fd;padding:6px;border-radius:6px;text-align:center"><small>'+t('totalInvoices')+'</small><br><b>'+totalInv.toFixed(2)+'</b></div><div style="background:#e8f5e9;padding:6px;border-radius:6px;text-align:center"><small>'+t('totalReceipts')+'</small><br><b>'+totalRec.toFixed(2)+'</b></div><div style="background:'+(bal>=0?'#ffebee':'#e8f5e9')+';padding:6px;border-radius:6px;text-align:center"><small>'+t('balanceDue')+'</small><br><b>'+bal.toFixed(2)+'</b></div></div>';
}

function renderVouchers(){ let box=document.getElementById('vouchers-list'); if(vouchers.length===0){ box.innerHTML='<small>'+window._t('noVouchers')+'</small>'; return;} box.innerHTML=vouchers.slice(-30).reverse().map(function(v){ let color=v.type==='receipt'?'#e8f5e9':'#ffebee'; return '<div style="background:'+color+';border:1px solid #ccc;padding:6px;border-radius:6px;margin:4px 0"><b>'+(v.type==='receipt'?window._t('btnReceipt')+' #':window._t('btnPayment')+' #')+v.number+'</b> '+v.fromto+' - '+v.amount.toFixed(2)+' Pi<br><small>'+v.desc+' | '+v.date+'</small> <button onclick="window.printVoucher(\''+v.id+'\')" style="float:left" class="btn btn-s">'+window._t('print')+'</button></div>'; }).join(''); }
window.printVoucher=function(id){ let v=vouchers.find(function(x){return x.id===id;}); if(!v) return; let acc=accounts.find(function(a){return a.id===v.accountId;}); let t=window._t; let html='<div class="voucher"><h3>'+(v.type==='receipt'?t('vReceipt'):t('vPayment'))+' #'+v.number+'</h3><div style="display:flex;justify-content:space-between"><span>'+t('vFromTo')+':</span><b>'+v.fromto+'</b></div><div style="display:flex;justify-content:space-between"><span>'+t('amount')+':</span><b>'+v.amount.toFixed(3)+'</b></div><div style="display:flex;justify-content:space-between"><span>'+t('accName')+':</span><b>'+(acc?acc.name:v.accountId)+'</b></div><div>'+t('vDesc')+': '+v.desc+'</div><div style="display:flex;justify-content:space-between;margin-top:15px"><span>________</span><span>________</span><span>________</span></div></div>'; document.getElementById('voucher-print-area').innerHTML=html+'<button class="btn btn-s" onclick="window.print()">🖨️ '+t('print')+'</button>'; };
function renderTrial(){ let box=document.getElementById('trial-report'); if(!accounts){box.innerHTML='';return;} let rows=''; let totalD=0,totalC=0; accounts.forEach(function(acc){ let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); if(d===0&&c===0) return; totalD+=d; totalC+=c; rows+='<tr><td>'+acc.code+'</td><td>'+acc.name+'</td><td>'+d.toFixed(2)+'</td><td>'+c.toFixed(2)+'</td><td>'+(d-c).toFixed(2)+'</td></tr>'; }); let balanced=Math.abs(totalD-totalC)<0.001; let t=window._t; document.getElementById('balance-badge').textContent=(balanced?t('balanced'):t('unbalanced'))+' D:'+totalD.toFixed(2)+' C:'+totalC.toFixed(2); document.getElementById('balance-badge').className=balanced?'badge badge-green':'badge badge-warn'; box.innerHTML='<table><thead><tr><th>'+t('code')+'</th><th>'+t('accName')+'</th><th>'+t('thDebit')+'</th><th>'+t('thCredit')+'</th><th>Bal</th></tr></thead><tbody>'+rows+'<tr style="background:#e8f5e9;font-weight:700"><td></td><td>Total</td><td>'+totalD.toFixed(2)+'</td><td>'+totalC.toFixed(2)+'</td><td>'+(balanced?'✅':'⚠️')+'</td></tr></tbody></table>'; }
function generateIncomeStatement(){ let box=document.getElementById('income-statement'); let t=window._t; let incAccs=accounts.filter(function(a){return a.type==='income';}); let expAccs=accounts.filter(function(a){return a.type==='expense';}); let totalInc=0,totalExp=0; let incRows='',expRows=''; incAccs.forEach(function(acc){ let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let net=c-d; if(net!==0){totalInc+=net; incRows+='<tr><td>'+acc.name+'</td><td>'+net.toFixed(2)+'</td></tr>';} }); expAccs.forEach(function(acc){ let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let net=d-c; if(net!==0){totalExp+=net; expRows+='<tr><td>'+acc.name+'</td><td>'+net.toFixed(2)+'</td></tr>';} }); let netInc=totalInc-totalExp; box.innerHTML='<h4 style="text-align:center">'+t('incomeTitle')+'</h4><table><thead><tr><th>'+t('revenues')+'</th><th>'+t('amount')+'</th></tr></thead><tbody>'+incRows+'<tr style="background:#e8f5e9;font-weight:700"><td>'+t('totalRev')+'</td><td>'+totalInc.toFixed(2)+'</td></tr></tbody></table><br><table><thead><tr><th>'+t('expenses')+'</th><th>'+t('amount')+'</th></tr></thead><tbody>'+expRows+'<tr style="background:#ffebee;font-weight:700"><td>'+t('totalExp')+'</td><td>'+totalExp.toFixed(2)+'</td></tr></tbody></table><div style="background:'+(netInc>=0?'#e8f5e9':'#ffebee')+';padding:8px;border-radius:6px;text-align:center;font-weight:700;margin-top:6px">'+t('netIncome')+': '+netInc.toFixed(3)+'</div>'; }
function generateBalanceSheet(){ let box=document.getElementById('balance-sheet'); let t=window._t; let assetAccs=accounts.filter(function(a){return a.type==='asset';}); let liabAccs=accounts.filter(function(a){return a.type==='liability';}); let eqAccs=accounts.filter(function(a){return a.type==='equity';}); let totalA=0,totalL=0,totalE=0; let aRows='',lRows='',eRows=''; assetAccs.forEach(function(acc){ let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let bal=d-c; if(bal!==0){totalA+=bal; aRows+='<tr><td>'+acc.name+'</td><td>'+bal.toFixed(2)+'</td></tr>';} }); liabAccs.forEach(function(acc){ let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let bal=c-d; if(bal!==0){totalL+=bal; lRows+='<tr><td>'+acc.name+'</td><td>'+bal.toFixed(2)+'</td></tr>';} }); eqAccs.forEach(function(acc){ let d=ledger.filter(function(x){return x.debitId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let c=ledger.filter(function(x){return x.creditId===acc.id;}).reduce(function(s,x){return s+x.amount;},0); let bal=c-d; if(bal!==0){totalE+=bal; eRows+='<tr><td>'+acc.name+'</td><td>'+bal.toFixed(2)+'</td></tr>';} }); let inc=0,exp=0; ledger.forEach(function(x){ let a=accounts.find(function(z){return z.id===x.creditId;}); if(a&&a.type==='income') inc+=x.amount; let b=accounts.find(function(z){return z.id===x.debitId;}); if(b&&b.type==='expense') exp+=x.amount; }); let net=inc-exp; totalE+=net; let balanced=Math.abs(totalA-(totalL+totalE))<0.01; box.innerHTML='<h4 style="text-align:center">'+t('balanceTitle')+'</h4><div class="row"><div><table><thead><tr><th>'+t('assets')+'</th><th>'+t('amount')+'</th></tr></thead><tbody>'+aRows+'<tr style="background:#e3f2fd;font-weight:700"><td>'+t('totalAssets')+'</td><td>'+totalA.toFixed(2)+'</td></tr></tbody></table></div><div><table><thead><tr><th>'+t('liabilities')+'</th><th>'+t('amount')+'</th></tr></thead><tbody>'+lRows+'<tr style="background:#fff3e0;font-weight:700"><td>'+t('totalLiab')+'</td><td>'+totalL.toFixed(2)+'</td></tr></tbody></table><br><table><thead><tr><th>'+t('equity')+'</th><th>'+t('amount')+'</th></tr></thead><tbody>'+eRows+'<tr><td>'+t('netIncome')+'</td><td>'+net.toFixed(2)+'</td></tr><tr style="background:#e8f5e9;font-weight:700"><td>'+t('totalEquity')+'</td><td>'+totalE.toFixed(2)+'</td></tr></tbody></table></div></div><div style="background:'+(balanced?'#e8f5e9':'#ffebee')+';padding:6px;border-radius:6px;text-align:center;font-weight:700;margin-top:6px">'+totalA.toFixed(2)+' = '+totalL.toFixed(2)+' + '+totalE.toFixed(2)+' '+(balanced?'✅':'⚠️')+'</div>'; }
function renderInv(f){ f=f||''; let list=inv.filter(function(p){return p.name.toLowerCase().includes(f.toLowerCase());}); document.getElementById('inv-body').innerHTML=list.map(function(p){ return '<tr><td>'+p.name+'</td><td>'+p.qty+'</td><td>'+p.price+'</td><td><button onclick="window.delInv('+inv.indexOf(p)+')">x</button></td></tr>'; }).join(''); document.getElementById('inv-product').innerHTML=inv.map(function(p,i){ return '<option value="'+i+'">'+p.name+'</option>'; }).join(''); }
function renderInvoices(){ document.getElementById('saved-invoices').innerHTML=invoices.slice(-10).reverse().map(function(it){ return '<div style="border:1px solid #ccc;padding:4px;margin:2px;border-radius:4px"><b>#'+it.id+'</b> '+it.customer+' '+it.total+'</div>'; }).join(''); }
function refreshCur(){ document.getElementById('inv-items').innerHTML=curInv.length===0?'<small>'+window._t('emptyCart')+'</small>':curInv.map(function(it,idx){ return '<div>'+it.name+' x'+it.qty+' <button onclick="window.removeCur('+idx+')" style="color:red;background:none;border:none">x</button></div>'; }).join(''); document.getElementById('inv-total').textContent=invTotal.toFixed(3); }
function updateReports(){ let inc=0,exp=0; ledger.forEach(function(x){ let a=accounts.find(function(z){return z.id===x.creditId;}); if(a&&a.type==='income') inc+=x.amount; let b=accounts.find(function(z){return z.id===x.debitId;}); if(b&&b.type==='expense') exp+=x.amount; }); document.getElementById('r-inc').textContent=inc.toFixed(2); document.getElementById('r-exp').textContent=exp.toFixed(2); document.getElementById('r-net').textContent=(inc-exp).toFixed(2); let ctx=document.getElementById('financeChart'); if(chart) chart.destroy(); if(ctx){ chart=new Chart(ctx,{type:'bar',data:{labels:[window._t('inc'),window._t('exp')],datasets:[{label:'Amount',data:[inc,exp],backgroundColor:['#4caf50','#e53935']}]},options:{responsive:true}}); } renderTrial(); }
window.delInv=function(i){ inv.splice(i,1); setData('inv2', inv); renderInv(); };
window.removeCur=function(idx){ curInv.splice(idx,1); invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty;},0); refreshCur(); };
function renderAll(){ checkSetup(); renderTree(); renderLedger(); renderVouchers(); renderCustomerSelect(); renderInv(); renderInvoices(); refreshCur(); updateReports(); }

document.querySelectorAll('.tab').forEach(function(tab){ tab.addEventListener('click', function(){ document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');}); document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active');}); tab.classList.add('active'); document.getElementById(tab.dataset.tab).classList.add('active'); if(tab.dataset.tab==='financials'){ generateIncomeStatement(); generateBalanceSheet(); } if(tab.dataset.tab==='ledger'){ renderAccountLedger(); } }); });
