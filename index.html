<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Merchant OS v2.2 Fixed</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#2e004a}body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:10px}.container{max-width:1000px;margin:auto;background:rgba(255,255,255,.08);padding:15px;border-radius:16px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tab{padding:8px 12px;background:rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}.tab.active{background:var(--p);color:#2e004a}.tab-content{display:none}.tab-content.active{display:block}.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:8px 0}.btn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin:3px}.btn-pi{background:var(--p);color:#2e004a}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}input,select{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--s);margin:4px 0;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;font-size:13px}th{background:var(--s);color:#fff}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;justify-content:space-between"><div>👋 <span id="t-app">Pi Merchant OS v2.2</span></div><select id="lang-picker" style="width:auto"><option value="ar">العربية</option><option value="en">English</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select></div>
<h2 id="main-title" style="text-align:center;color:var(--p)">نظام التاجر الذكي</h2>
<div class="tabs">
<div class="tab active" data-tab="entry" id="lb-entry">قيد</div><div class="tab" data-tab="invoice" id="lb-inv">فاتورة</div><div class="tab" data-tab="inventory" id="lb-stock">مخزون</div><div class="tab" data-tab="partners" id="lb-part">عملاء</div><div class="tab" data-tab="reports" id="lb-rep">تقارير</div><div class="tab" data-tab="pay" id="lb-pay">Pi</div>
</div>
<div id="entry" class="tab-content active"><div class="card"><h3 id="h-entry">إضافة قيد</h3><form id="form-entry"><select id="e-type"><option value="income" id="op-inc">إيراد</option><option value="expense" id="op-exp">مصروف</option><option value="asset" id="op-ast">أصل</option></select><input id="e-amount" type="number" step="0.0001" placeholder="المبلغ π" required><input id="e-desc" placeholder="الوصف" required><button class="btn btn-pi" type="submit" id="btn-save-entry">حفظ</button></form></div><div class="card"><table><tbody id="ledger-body"></tbody></table></div></div>
<div id="invoice" class="tab-content"><div class="card"><h3 id="h-inv">إنشاء فاتورة</h3><input id="inv-customer" placeholder="Customer"><select id="inv-product"></select><input id="inv-qty" type="number" value="1"><button class="btn btn-pi" type="button" id="btn-add-inv">إضافة</button><div id="inv-items"></div><h4><span id="lb-total">الإجمالي</span>: <span id="inv-total">0</span> π</h4><button class="btn btn-s" type="button" id="btn-pdf">PDF</button><button class="btn btn-w" type="button" id="btn-wa">WhatsApp</button><button class="btn btn-pi" type="button" id="btn-save-inv">حفظ وخصم</button></div></div>
<div id="inventory" class="tab-content"><div class="card"><form id="form-inv"><input id="p-name" placeholder="اسم المنتج" required><input id="p-qty" type="number" placeholder="الكمية" required><input id="p-price" type="number" step="0.0001" placeholder="سعر البيع" required><input id="p-cost" type="number" step="0.0001" placeholder="التكلفة"><button class="btn btn-pi" type="submit" id="btn-add-prod">إضافة منتج</button></form></div><div class="card"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Barcode</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>
<div id="partners" class="tab-content"><div class="card"><form id="form-part"><input id="pt-name" placeholder="الاسم" required><select id="pt-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select><input id="pt-phone" placeholder="967..."><button class="btn btn-pi" type="submit">حفظ</button></form></div><div class="card"><table><tbody id="pt-body"></tbody></table></div></div>
<div id="reports" class="tab-content"><div class="card"><select id="rep-period"><option value="all">الكل</option><option value="today">اليوم</option><option value="week">أسبوع</option><option value="month">شهر</option></select><p><span id="lb-inc">إيراد</span>: <span id="r-inc">0</span> | <span id="lb-exp">مصروف</span>: <span id="r-exp">0</span> | <b id="lb-net">صافي</b>: <b id="r-net">0</b></p><div style="background:#fff;padding:8px;border-radius:8px"><canvas id="financeChart"></canvas></div><button class="btn btn-s" type="button" id="btn-excel">Excel</button><button class="btn btn-s" type="button" id="btn-report-pdf">PDF</button></div></div>
<div id="pay" class="tab-content"><div class="card"><input id="pay_amount" type="number" value="1"><button class="btn btn-pi" type="button" id="btn-pi-pay">Pay with Pi</button><div id="pi-status"></div></div></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
const T={ar:{main:'نظام التاجر الذكي',app:'Pi Merchant OS v2.2',e:'قيد',inv:'فاتورة',stock:'مخزون',part:'عملاء',rep:'تقارير',pay:'Pi',hE:'إضافة قيد',hI:'إنشاء فاتورة',save:'حفظ',inc:'إيراد',exp:'مصروف',ast:'أصل',total:'الإجمالي',addInv:'إضافة للفاتورة',addProd:'إضافة منتج',income:'إيراد',expense:'مصروف',net:'صافي'},en:{main:'Smart Merchant System',app:'Pi Merchant OS v2.2',e:'Entry',inv:'Invoice',stock:'Stock',part:'Partners',rep:'Reports',pay:'Pi',hE:'Add Entry',hI:'Create Invoice',save:'Save',inc:'Income',exp:'Expense',ast:'Asset',total:'Total',addInv:'Add to Invoice',addProd:'Add Product',income:'Income',expense:'Expense',net:'Net'},tr:{main:'Akıllı Tüccar Sistemi',app:'Pi Merchant OS v2.2',e:'Kayıt',inv:'Fatura',stock:'Stok',part:'Ortaklar',rep:'Raporlar',pay:'Pi',hE:'Kayıt Ekle',hI:'Fatura Oluştur',save:'Kaydet',inc:'Gelir',exp:'Gider',ast:'Varlık',total:'Toplam',addInv:'Faturaya Ekle',addProd:'Ürün Ekle',income:'Gelir',expense:'Gider',net:'Net'},zh:{main:'智能商家系统',app:'Pi Merchant OS v2.2',e:'分录',inv:'发票',stock:'库存',part:'合作伙伴',rep:'报告',pay:'Pi',hE:'添加分录',hI:'创建发票',save:'保存',inc:'收入',exp:'支出',ast:'资产',total:'总计',addInv:'添加到发票',addProd:'添加产品',income:'收入',expense:'支出',net:'净额'},ja:{main:'スマートマーチャント',app:'Pi Merchant OS v2.2',e:'仕訳',inv:'請求書',stock:'在庫',part:'パートナー',rep:'レポート',pay:'Pi',hE:'仕訳追加',hI:'請求書作成',save:'保存',inc:'収入',exp:'経費',ast:'資産',total:'合計',addInv:'請求書に追加',addProd:'商品追加',income:'収入',expense:'経費',net:'純利益'},vi:{main:'Hệ thống thương nhân',app:'Pi Merchant OS v2.2',e:'Bút toán',inv:'Hóa đơn',stock:'Kho',part:'Đối tác',rep:'Báo cáo',pay:'Pi',hE:'Thêm bút toán',hI:'Tạo hóa đơn',save:'Lưu',inc:'Thu nhập',exp:'Chi phí',ast:'Tài sản',total:'Tổng',addInv:'Thêm vào HĐ',addProd:'Thêm SP',income:'Thu nhập',expense:'Chi phí',net:'Ròng'},fr:{main:'Système Marchand',app:'Pi Merchant OS v2.2',e:'Écriture',inv:'Facture',stock:'Stock',part:'Partenaires',rep:'Rapports',pay:'Pi',hE:'Ajouter',hI:'Créer Facture',save:'Enregistrer',inc:'Revenu',exp:'Dépense',ast:'Actif',total:'Total',addInv:'Ajouter',addProd:'Ajouter Produit',income:'Revenu',expense:'Dépense',net:'Net'},de:{main:'Händler System',app:'Pi Merchant OS v2.2',e:'Buchung',inv:'Rechnung',stock:'Lager',part:'Partner',rep:'Berichte',pay:'Pi',hE:'Buchung',hI:'Rechnung',save:'Speichern',inc:'Einnahme',exp:'Ausgabe',ast:'Anlage',total:'Gesamt',addInv:'Hinzufügen',addProd:'Produkt',income:'Einnahme',expense:'Ausgabe',net:'Netto'},es:{main:'Sistema Comerciante',app:'Pi Merchant OS v2.2',e:'Asiento',inv:'Factura',stock:'Inventario',part:'Socios',rep:'Informes',pay:'Pi',hE:'Añadir',hI:'Crear Factura',save:'Guardar',inc:'Ingreso',exp:'Gasto',ast:'Activo',total:'Total',addInv:'Añadir',addProd:'Añadir Producto',income:'Ingreso',expense:'Gasto',net:'Neto'}};
function applyLang(l){var t=T[l]||T.en;document.documentElement.lang=l;document.documentElement.dir=(l==='ar')?'rtl':'ltr';document.getElementById('main-title').textContent=t.main;document.getElementById('t-app').textContent=t.app;document.getElementById('lb-entry').textContent=t.e;document.getElementById('lb-inv').textContent=t.inv;document.getElementById('lb-stock').textContent=t.stock;document.getElementById('lb-part').textContent=t.part;document.getElementById('lb-rep').textContent=t.rep;document.getElementById('lb-pay').textContent=t.pay;document.getElementById('h-entry').textContent=t.hE;document.getElementById('h-inv').textContent=t.hI;document.getElementById('btn-save-entry').textContent=t.save;document.getElementById('btn-add-inv').textContent=t.addInv;document.getElementById('btn-add-prod').textContent=t.addProd;document.getElementById('op-inc').textContent=t.inc;document.getElementById('op-exp').textContent=t.exp;document.getElementById('op-ast').textContent=t.ast;document.getElementById('lb-total').textContent=t.total;document.getElementById('lb-inc').textContent=t.income;document.getElementById('lb-exp').textContent=t.expense;document.getElementById('lb-net').textContent=t.net;localStorage.setItem('erp_lang',l);}
var picker=document.getElementById('lang-picker');var saved=localStorage.getItem('erp_lang')||'ar';picker.value=saved;applyLang(saved);picker.addEventListener('change',function(){applyLang(this.value);});
var ledger=JSON.parse(localStorage.getItem('ledger')||'[]');var inv=JSON.parse(localStorage.getItem('inv2')||'[]');var partners=JSON.parse(localStorage.getItem('partners2')||'[]');var curInv=[];var invTotal=0;var chart=null;
document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active')});tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active');});});
function renderLedger(){document.getElementById('ledger-body').innerHTML=ledger.slice(-20).reverse().map(function(l){return '<tr><td>'+l.date+'</td><td>'+l.desc+'</td><td>'+l.type+'</td><td>'+l.amount+'</td></tr>';}).join('');}
function renderInv(){document.getElementById('inv-body').innerHTML=inv.map(function(p,i){return '<tr><td>'+p.name+'</td><td>'+p.qty+'</td><td>'+p.price+'</td><td><svg id="bc'+i+'"></svg></td><td><button type="button" onclick="window.delInv('+i+')">x</button></td></tr>';}).join('');document.getElementById('inv-product').innerHTML=inv.map(function(p,i){return '<option value="'+i+'">'+p.name+' - '+p.price+' Pi</option>';}).join('');setTimeout(function(){inv.forEach(function(p,i){try{JsBarcode('#bc'+i,p.name.substring(0,8)+i,{width:1,height:18,displayValue:false});}catch(e){}});},200);}
function renderPartners(){document.getElementById('pt-body').innerHTML=partners.map(function(p){return '<tr><td>'+p.name+'</td><td>'+p.type+'</td><td>'+p.phone+'</td><td><a class="btn btn-w" target="_blank" href="https://wa.me/'+p.phone+'">WA</a></td></tr>';}).join('');}
window.delInv=function(i){inv.splice(i,1);localStorage.setItem('inv2',JSON.stringify(inv));renderInv();};
function updateReports(){var inc=ledger.filter(function(x){return x.type==='income'}).reduce(function(s,x){return s+x.amount},0);var exp=ledger.filter(function(x){return x.type==='expense'}).reduce(function(s,x){return s+x.amount},0);document.getElementById('r-inc').textContent=inc.toFixed(2);document.getElementById('r-exp').textContent=exp.toFixed(2);document.getElementById('r-net').textContent=(inc-exp).toFixed(2);var c=document.getElementById('financeChart');if(chart)chart.destroy();chart=new Chart(c,{type:'bar',data:{labels:['Income','Expense','Net'],datasets:[{data:[inc,exp,inc-exp],backgroundColor:['#4caf50','#f44336','#ffd700']}]},options:{responsive:true,plugins:{legend:{display:false}}}});}
document.getElementById('form-entry').addEventListener('submit',function(e){e.preventDefault();ledger.push({date:new Date().toLocaleDateString(),type:document.getElementById('e-type').value,amount:parseFloat(document.getElementById('e-amount').value),desc:document.getElementById('e-desc').value});localStorage.setItem('ledger',JSON.stringify(ledger));renderLedger();updateReports();e.target.reset();});
document.getElementById('form-inv').addEventListener('submit',function(e){e.preventDefault();inv.push({name:document.getElementById('p-name').value,qty:parseInt(document.getElementById('p-qty').value),price:parseFloat(document.getElementById('p-price').value),cost:parseFloat(document.getElementById('p-cost').value||0)});localStorage.setItem('inv2',JSON.stringify(inv));renderInv();e.target.reset();});
document.getElementById('form-part').addEventListener('submit',function(e){e.preventDefault();partners.push({name:document.getElementById('pt-name').value,type:document.getElementById('pt-type').value,phone:document.getElementById('pt-phone').value});localStorage.setItem('partners2',JSON.stringify(partners));renderPartners();e.target.reset();});
document.getElementById('btn-add-inv').addEventListener('click',function(){var idx=document.getElementById('inv-product').value;var q=parseInt(document.getElementById('inv-qty').value||1);if(idx==='')return;var prod=inv[idx];curInv.push({name:prod.name,price:prod.price,qty:q});invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty},0);document.getElementById('inv-items').innerHTML=curInv.map(function(it){return it.name+' x'+it.qty+'<br>';}).join('');document.getElementById('inv-total').textContent=invTotal.toFixed(3);});
document.getElementById('btn-save-inv').addEventListener('click',function(){if(!curInv.length)return;ledger.push({date:new Date().toLocaleDateString(),type:'income',amount:invTotal,desc:'Invoice '+document.getElementById('inv-customer').value});curInv.forEach(function(ci){var p=inv.find(function(x){return x.name===ci.name});if(p)p.qty-=ci.qty;});localStorage.setItem('ledger',JSON.stringify(ledger));localStorage.setItem('inv2',JSON.stringify(inv));renderInv();renderLedger();updateReports();curInv=[];invTotal=0;document.getElementById('inv-items').innerHTML='';document.getElementById('inv-total').textContent='0';alert('Saved');});
document.getElementById('btn-pdf').addEventListener('click',function(){var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();doc.text('Invoice',10,10);var y=20;curInv.forEach(function(it){doc.text(it.name+' x'+it.qty+' = '+it.price*it.qty+' Pi',10,y);y+=7;});doc.text('Total '+invTotal+' Pi',10,y+10);doc.save('invoice.pdf');});
document.getElementById('btn-report-pdf').addEventListener('click',function(){var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();doc.text('Report',10,10);doc.text('Income '+document.getElementById('r-inc').textContent,10,20);doc.text('Expense '+document.getElementById('r-exp').textContent,10,30);doc.save('report.pdf');});
document.getElementById('btn-excel').addEventListener('click',function(){var ws=XLSX.utils.json_to_sheet(ledger);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ledger');XLSX.writeFile(wb,'ledger.xlsx');});
document.getElementById('btn-wa').addEventListener('click',function(){var text='*Invoice*%0A'+curInv.map(function(i){return i.name+' x'+i.qty+' = '+i.price*i.qty+' Pi'}).join('%0A')+'%0ATotal '+invTotal+' Pi';window.open('https://wa.me/?text='+text,'_blank');});
try{if(typeof Pi!=='undefined'){Pi.init({version:'2.0',sandbox:true});document.getElementById('pi-status').textContent='Pi Ready';}}catch(e){}
renderLedger();renderInv();renderPartners();updateReports();
});
</script>
</body>
                                                                                                                                                                                                                        </html>
