*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f0ff}

.btn{border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}

let currentUser=localStorage.getItem('pi_current_user')||'guest';let k=function(n){return n+'_'+currentUser;};function getData(n,d){try{return JSON.parse(localStorage.getItem(k(n))||JSON.stringify(d));}catch(e){return d;}}function setData(n,v){localStorage.setItem(k(n), JSON.stringify(v));}
let accounts=getData('accounts_v4', null);let ledger=getData('ledger_double', []);let vouchers=getData('vouchers_v1', []);let inv=getData('inv2',[]);let invoices=getData('invoices_v23',[]);let sysConfig=getData('sysConfig', null);let curInv=[];let invTotal=0;let chart=null;let voucherCounter=getData('voucherCounter', 1001);
function defaultTree(){return [{id:'1',code:'1000',name:'Assets',parent:null,type:'asset'},{id:'11',code:'1100',name:'Current Assets',parent:'1',type:'asset'},{id:'111',code:'1101',name:'Cash - Pi',parent:'11',type:'asset'},{id:'112',code:'1102',name:'Bank',parent:'11',type:'asset'},{id:'113',code:'1103',name:'Receivables',parent:'11',type:'asset'},{id:'2',code:'2000',name:'Liabilities',parent:null,type:'liability'},{id:'21',code:'2100',name:'Payables',parent:'2',type:'liability'},{id:'3',code:'3000',name:'Equity',parent:null,type:'equity'},{id:'31',code:'3001',name:'Capital',parent:'3',type:'equity'},{id:'4',code:'4000',name:'Income',parent:null,type:'income'},{id:'41',code:'4100',name:'Sales',parent:'4',type:'income'},{id:'5',code:'5000',name:'Expenses',parent:null,type:'expense'},{id:'51',code:'5100',name:'Rent',parent:'5',type:'expense'},{id:'52',code:'5200',name:'General Expenses',parent:'5',type:'expense'}];}
</script><div id="vouchers" class="tab-content"><div class="card"><h4 id="h-vouchers"></h4><div class="row"><button class="btn btn-green" id="btn-show-receipt"></button><button class="btn btn-red" id="btn-show-payment"></button></div><form id="form-voucher" style="display:none;margin-top:8px"><input type="hidden" id="v-type"><div class="row"><input id="v-number" readonly><select id="v-method"><option value="cash">Cash</option><option value="bank">Bank</option><option value="pi">Pi</option></select></div><div class="row"><input id="v-fromto" required placeholder="From/To"><input id="v-desc-v" required placeholder="Description"></div><div class="row"><input id="v-amount" type="number" step="0.001" required placeholder="Amount"><select id="v-account"></select></div><button class="btn btn-pi" id="btn-save-voucher" type="submit" style="width:100%"></button></form></div><div class="card"><h4 id="h-vouchers-list">Vouchers</h4><div id="vouchers-list"></div></div></div>
<div id="invoice" class="tab-content"><div class="card"><h4 id="h-inv"></h4><div class="row"><select id="inv-customer"></select><select id="inv-product"></select></div><div class="row"><input id="inv-qty" type="number" value="1"><button class="btn btn-s" id="btn-add-inv"></button></div><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody id="inv-cart"></tbody></table><div style="text-align:right"><b id="lb-total">Total</b>: <span id="inv-total">0</span></div><button class="btn btn-pi" id="btn-save-inv" style="width:100%"></button></div></div>
<div id="inventory" class="tab-content"><div class="card"><h4 id="h-add-prod"></h4><form id="form-product"><div class="row"><input id="p-name" required placeholder="Name"><input id="p-qty" type="number" required placeholder="Qty"></div><div class="row"><input id="p-price" type="number" step="0.001" required placeholder="Price"><input id="p-cost" type="number" step="0.001" required placeholder="Cost"></div><button class="btn btn-pi" id="btn-add-prod" type="submit" style="width:100%"></button></form><input id="prod-search" placeholder="Search..."><div id="products-list"></div></div></div>
<div id="financials" class="tab-content"><div class="card"><h4 id="h-financials"></h4><div class="row"><button class="btn btn-s" id="btn-gen-income"></button><button class="btn btn-s" id="btn-gen-balance"></button><button class="btn btn-s" id="btn-export-financials"></button></div><div id="financials-output" class="statement"></div><canvas id="finance-chart"></canvas></div></div>
<div id="reports" class="tab-content"><div class="card"><h4 id="h-reports"></h4><div class="row"><button class="btn btn-s" id="btn-excel">Excel</button><button class="btn btn-s" id="btn-report-pdf">PDF</button></div><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody id="trial-body"></tbody></table><div id="trial-summary"></div></div></div>
<script>
function initIfEmpty(){if(!accounts){accounts=defaultTree();setData('accounts_v4', accounts);} if(!sysConfig){document.getElementById('setup-modal').style.display='flex';} }
function renderTree(){let c=document.getElementById('tree-container');if(!c) return;let html='';accounts.forEach(a=>{let level=a.parent? (accounts.find(p=>p.id===a.parent)?1:0):0;let cls=level===0?'tree-item l1':'tree-item';html+=`<div class="${cls}"><span>${a.code} - ${a.name}</span><span>${a.type}</span></div>`;});c.innerHTML=html;let sel=document.getElementById('acc-parent');let eD=document.getElementById('e-debit');let eC=document.getElementById('e-credit');let la=document.getElementById('ledger-account-select');let va=document.getElementById('v-account');let ic=document.getElementById('inv-customer');let ps=[sel,eD,eC,la,va,ic];ps.forEach(s=>{if(!s) return;let cur=s.value; s.innerHTML='<option value="">'+(s===sel? _t('parentRoot'):_t('selectCustomer'))+'</option>'; accounts.forEach(a=>{s.innerHTML+=`<option value="${a.id}">${a.code}-${a.name}</option>`;}); s.value=cur;});}
function renderLedger(){let b=document.getElementById('ledger-body');if(!b) return; b.innerHTML=''; ledger.slice(-50).reverse().forEach(l=>{b.innerHTML+=`<tr><td>${new Date(l.date).toLocaleDateString()}</td><td>${l.debitName||l.debit}</td><td>${l.creditName||l.credit}</td><td>${l.desc}</td><td>${l.amount}</td></tr>`;});}
function renderAccountLedger(){let sel=document.getElementById('ledger-account-select');if(!sel||!sel.value) return;let id=sel.value;let body=document.getElementById('account-ledger-body');let bal=0; body.innerHTML=''; ledger.forEach(l=>{if(l.debit===id||l.credit===id){let d=l.debit===id? l.amount:0; let cr=l.credit===id? l.amount:0; if(l.debit===id) bal+=l.amount; else bal-=l.amount; body.innerHTML+=`<tr><td>${new Date(l.date).toLocaleDateString()}</td><td>${l.desc}</td><td>${d||''}</td><td>${cr||''}</td><td>${bal.toFixed(3)}</td></tr>`;}}); document.getElementById('account-ledger-balance').innerHTML='<b>'+_t('thLBalance')+': '+bal.toFixed(3)+'</b>';}
function renderVouchers(){let list=document.getElementById('vouchers-list');if(!list) return; list.innerHTML=''; if(vouchers.length===0){list.innerHTML=_t('noVouchers'); return;} vouchers.slice(-30).reverse().forEach(v=>{list.innerHTML+=`<div class="voucher"><b>#${v.number}</b> ${v.type} - ${v.fromTo} - ${v.amount} <br><small>${v.desc}</small></div>`;});}
function renderProducts(){let list=document.getElementById('products-list');if(!list) return; let prods=getData('products_v1',[]); list.innerHTML=''; prods.forEach(p=>{list.innerHTML+=`<div class="tree-item"><span>${p.name}</span><span>${p.qty} x ${p.price}</span></div>`;}); let invP=document.getElementById('inv-product'); if(invP){invP.innerHTML=''; prods.forEach(p=>{invP.innerHTML+=`<option value="${p.id}">${p.name}</option>`;});}}
function renderTrial(){let body=document.getElementById('trial-body'); if(!body) return; let balances={}; accounts.forEach(a=>balances[a.id]=0); ledger.forEach(l=>{if(balances[l.debit]!==undefined) balances[l.debit]+=l.amount; if(balances[l.credit]!==undefined) balances[l.credit]-=l.amount;}); body.innerHTML=''; let totD=0, totC=0; accounts.forEach(a=>{let b=balances[a.id]; if(b!==0){let d=b>0?b:0; let cr=b<0? -b:0; totD+=d; totC+=cr; body.innerHTML+=`<tr><td>${a.code}-${a.name}</td><td>${d?d.toFixed(3):''}</td><td>${cr?cr.toFixed(3):''}</td><td>${b.toFixed(3)}</td></tr>`;}}); document.getElementById('trial-summary').innerHTML=`<b>${_t('balanced')}: D ${totD.toFixed(3)} / C ${totC.toFixed(3)} ${Math.abs(totD-totC)<0.001? '✅':'⚠️'}</b>`;}
function renderAll(){renderTree();renderLedger();renderVouchers();renderProducts();renderTrial();}
document.addEventListener('DOMContentLoaded', ()=>{initIfEmpty(); let lang=localStorage.getItem('pi_lang')||'ar'; document.getElementById('lang-picker').value=lang; applyLang(lang); renderAll(); document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click', ()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active')); t.classList.add('active'); document.getElementById(t.dataset.tab).classList.add('active');});}); document.getElementById('lang-picker').addEventListener('change', e=>applyLang(e.target.value)); document.getElementById('form-account').addEventListener('submit', e=>{e.preventDefault(); let code=document.getElementById('acc-code').value; let name=document.getElementById('acc-name').value; let parent=document.getElementById('acc-parent').value||null; let type=document.getElementById('acc-type').value; accounts.push({id:Date.now().toString(),code,name,parent,type}); setData('accounts_v4', accounts); e.target.reset(); renderAll();}); document.getElementById('form-entry').addEventListener('submit', e=>{e.preventDefault(); let debit=document.getElementById('e-debit').value; let credit=document.getElementById('e-credit').value; let amount=parseFloat(document.getElementById('e-amount').value); let desc=document.getElementById('e-desc').value; if(!debit||!credit||!amount) return; let dAcc=accounts.find(a=>a.id===debit); let cAcc=accounts.find(a=>a.id===credit); ledger.push({id:Date.now(),date:new Date().toISOString(),debit,credit,debitName:dAcc?dAcc.name:debit,creditName:cAcc?cAcc.name:credit,amount,desc}); setData('ledger_double', ledger); e.target.reset(); renderAll();}); document.getElementById('btn-do-setup').addEventListener('click', ()=>{let act=document.getElementById('setup-activity').value; let cur=document.getElementById('setup-currency').value; let cap=parseFloat(document.getElementById('setup-capital').value)||50000; sysConfig={activity:act,currency:cur,capital:cap}; setData('sysConfig', sysConfig); accounts=defaultTree(); setData('accounts_v4', accounts); ledger=[{id:1,date:new Date().toISOString(),debit:accounts[2].id,credit:accounts[7].id,debitName:'Cash - Pi',creditName:'Capital',amount:cap,desc:'Initial capital'}]; setData('ledger_double', ledger); document.getElementById('setup-modal').style.display='none'; renderAll();}); document.getElementById('btn-filter-ledger').addEventListener('click', renderAccountLedger); document.getElementById('ledger-account-select').addEventListener('change', renderAccountLedger); document.getElementById('form-voucher').addEventListener('submit', e=>{e.preventDefault(); let type=document.getElementById('v-type').value; let number=document.getElementById('v-number').value; let fromTo=document.getElementById('v-fromto').value; let descV=document.getElementById('v-desc-v').value; let amount=parseFloat(document.getElementById('v-amount').value); let acc=document.getElementById('v-account').value; let method=document.getElementById('v-method').value; vouchers.push({id:Date.now(),type,number,fromTo,desc:descV,amount,account:acc,method,date:new Date().toISOString()}); setData('vouchers_v1', vouchers); voucherCounter++; setData('voucherCounter', voucherCounter); let cashAcc=accounts.find(a=>a.code==='1101'); if(cashAcc&&acc){let debit=type==='receipt'? cashAcc.id:acc; let credit=type==='receipt'? acc:cashAcc.id; ledger.push({id:Date.now(),date:new Date().toISOString(),debit,credit,amount,desc:descV}); setData('ledger_double', ledger);} e.target.reset(); document.getElementById('form-voucher').style.display='none'; renderAll();}); document.getElementById('btn-show-receipt').addEventListener('click', ()=>{document.getElementById('form-voucher').style.display='block'; document.getElementById('v-type').value='receipt'; document.getElementById('v-number').value='REC-'+voucherCounter;}); document.getElementById('btn-show-payment').addEventListener('click', ()=>{document.getElementById('form-voucher').style.display='block'; document.getElementById('v-type').value='payment'; document.getElementById('v-number').value='PAY-'+voucherCounter;}); document.getElementById('form-product').addEventListener('submit', e=>{e.preventDefault(); let prods=getData('products_v1',[]); prods.push({id:Date.now().toString(),name:document.getElementById('p-name').value,qty:parseFloat(document.getElementById('p-qty').value),price:parseFloat(document.getElementById('p-price').value),cost:parseFloat(document.getElementById('p-cost').value)}); setData('products_v1', prods); e.target.reset(); renderProducts();}); document.getElementById('btn-gen-income').addEventListener('click', ()=>{let inc=0, exp=0; ledger.forEach(l=>{let d=accounts.find(a=>a.id===l.debit); let c=accounts.find(a=>a.id===l.credit); if(c&&c.type==='income') inc+=l.amount; if(d&&d.type==='expense') exp+=l.amount;}); document.getElementById('financials-output').innerHTML=`<b>${_t('incomeTitle')}</b><br>${_t('revenues')}: ${inc.toFixed(3)}<br>${_t('expenses')}: ${exp.toFixed(3)}<br><b>${_t('net')}: ${(inc-exp).toFixed(3)}</b>`;}); document.getElementById('btn-excel').addEventListener('click', ()=>{let ws=XLSX.utils.json_to_sheet(ledger); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Ledger'); XLSX.writeFile(wb, 'ledger.xlsx');}); document.getElementById('btn-report-pdf').addEventListener('click', ()=>{let {jsPDF}=window.jspdf; let doc=new jsPDF(); doc.text('Trial Balance',10,10); let y=20; accounts.forEach(a=>{doc.text(a.code+' '+a.name,10,y); y+=6;}); doc.save('trial.pdf');});});
</script>
