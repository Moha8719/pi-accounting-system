<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Merchant OS v2</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#2e004a}body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:10px}.container{max-width:1000px;margin:auto;background:rgba(255,255,255,.08);padding:15px;border-radius:16px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tab{padding:8px 11px;background:rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:12px;font-weight:700}.tab.active{background:var(--p);color:#2e004a}.tab-content{display:none}.tab-content.active{display:block}.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:8px 0}.btn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin:3px}.btn-pi{background:var(--p);color:#2e004a}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}input,select{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--s);margin:4px 0;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:7px;border-bottom:1px solid #ddd;font-size:13px}th{background:var(--s);color:#fff}.alert-low{background:#ffebee;color:#c62828;padding:4px 8px;border-radius:6px;font-size:11px}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;justify-content:space-between"><div>👋 Pi Merchant OS v2</div><select id="lang-picker" style="width:auto"><option value="ar">AR</option><option value="en">EN</option></select></div>
<h2 id="main-title" style="text-align:center;color:var(--p)">نظام التاجر الذكي</h2>
<div class="tabs">
<div class="tab active" data-tab="entry">قيد</div><div class="tab" data-tab="invoice">فاتورة</div><div class="tab" data-tab="inventory">مخزون</div><div class="tab" data-tab="partners">عملاء</div><div class="tab" data-tab="reports">تقارير</div><div class="tab" data-tab="pay">Pi</div>
</div>

<!-- 1. قيد -->
<div id="entry" class="tab-content active"><div class="card"><h3>إضافة قيد</h3><form id="form-entry"><select id="e-type"><option value="income">إيراد</option><option value="expense">مصروف</option><option value="asset">أصل</option></select><input id="e-amount" type="number" step="0.0001" placeholder="المبلغ π" required><input id="e-desc" placeholder="الوصف" required><button class="btn btn-pi" type="submit">حفظ</button></form></div><div class="card"><table><tbody id="ledger-body"></tbody></table></div></div>

<!-- 2. فاتورة جديد -->
<div id="invoice" class="tab-content"><div class="card"><h3>إنشاء فاتورة</h3><input id="inv-customer" placeholder="اسم العميل"><select id="inv-product"></select><input id="inv-qty" type="number" value="1"><button class="btn btn-pi" id="btn-add-to-inv">إضافة للفاتورة</button><div id="inv-items" style="margin:10px 0"></div><h4>الإجمالي: <span id="inv-total">0</span> π</h4><button class="btn btn-s" id="btn-pdf">PDF 📄</button><button class="btn btn-w" id="btn-wa">واتساب 💬</button><button class="btn btn-pi" id="btn-save-inv">حفظ وخصم مخزون</button></div></div>

<!-- 3. مخزون مطور -->
<div id="inventory" class="tab-content"><div class="card"><form id="form-inv"><input id="p-name" placeholder="اسم المنتج" required><input id="p-qty" type="number" placeholder="الكمية" required><input id="p-price" type="number" step="0.0001" placeholder="سعر البيع" required><input id="p-cost" type="number" step="0.0001" placeholder="تكلفة الشراء"><input id="p-min" type="number" placeholder="حد التنبيه (مثلا 5)"><button class="btn btn-pi" type="submit">إضافة منتج</button></form></div><div class="card"><h4>المخزون <span id="low-count"></span></h4><table><thead><tr><th>منتج</th><th>كمية</th><th>سعر</th><th>تكلفة</th><th>باركود</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>

<!-- 4. عملاء مطور -->
<div id="partners" class="tab-content"><div class="card"><form id="form-part"><input id="pt-name" placeholder="اسم العميل/المورد" required><select id="pt-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select><input id="pt-phone" placeholder="واتساب مع رمز الدولة مثلا 9677..."><button class="btn btn-pi" type="submit">حفظ</button></form></div><div class="card"><table><thead><tr><th>الاسم</th><th>النوع</th><th>هاتف</th><th>رصيد</th><th>كشف حساب</th></tr></thead><tbody id="pt-body"></tbody></table></div><div class="card" id="statement-box" style="display:none"><h4>كشف حساب: <span id="st-name"></span></h4><div id="st-details"></div><button class="btn btn-s" id="btn-st-pdf">PDF كشف حساب</button></div></div>

<!-- تقارير -->
<div id="reports" class="tab-content"><div class="card"><select id="rep-period"><option value="all">الكل</option><option value="today">اليوم</option><option value="week">هذا الأسبوع</option><option value="month">هذا الشهر</option></select><p>إيراد: <span id="r-inc">0</span> | مصروف: <span id="r-exp">0</span> | صافي: <b id="r-net">0</b> | تكلفة بضاعة: <span id="r-cogs">0</span></p><div style="background:#fff;padding:8px;border-radius:8px"><canvas id="financeChart"></canvas></div><button class="btn btn-s" id="btn-excel">Excel 📊</button><button class="btn btn-s" id="btn-report-pdf">تقرير PDF</button></div></div>

<div id="pay" class="tab-content"><div class="card"><input id="pay_amount" type="number" value="1" step="0.01"><button class="btn btn-pi" id="btn-pi-pay">ادفع بـ Pi</button><div id="pi-status" style="margin-top:8px;color:#ffeb3b"></div></div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
// DATA
let ledger=JSON.parse(localStorage.getItem('ledger')||'[]');
let inv=JSON.parse(localStorage.getItem('inv2')||'[]');
let partners=JSON.parse(localStorage.getItem('partners2')||'[]');
let curInv=[]; let curPartner=null; let chart=null;

// TABS
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');}));

// LANG SIMPLE
document.getElementById('lang-picker').addEventListener('change',e=>{document.documentElement.dir=e.target.value==='ar'?'rtl':'ltr'});

// RENDER FUNCTIONS
function renderLedger(){document.getElementById('ledger-body').innerHTML=ledger.slice(-20).reverse().map(l=>`<tr><td>${l.date}</td><td>${l.desc}</td><td>${l.type}</td><td>${l.amount}</td></tr>`).join('')}
function renderInv(){let low=0;document.getElementById('inv-body').innerHTML=inv.map((p,i)=>{let isLow=p.qty<= (p.min||5); if(isLow) low++; return `<tr><td>${p.name} ${isLow?'<span class=alert-low>ناقص</span>':''}</td><td>${p.qty}</td><td>${p.price}</td><td>${p.cost||0}</td><td><svg id="bc${i}"></svg></td><td><button onclick="delInv(${i})">x</button></td></tr>`}).join('');document.getElementById('low-count').textContent=low?`(${low} ناقص)`:'';
setTimeout(()=>inv.forEach((p,i)=>{try{JsBarcode(`#bc${i}`,p.name.substring(0,10)+i,{width:1,height:20,displayValue:false})}catch{}}),200);
document.getElementById('inv-product').innerHTML=inv.map((p,i)=>`<option value="${i}">${p.name} - ${p.price}π (${p.qty})</option>`).join('');
}
function renderPartners(){document.getElementById('pt-body').innerHTML=partners.map((p,i)=>{let bal=ledger.filter(l=>l.customer===p.name).reduce((s,l)=>s+(l.type==='income'?l.amount:-l.amount),0); return `<tr><td>${p.name}</td><td>${p.type}</td><td>${p.phone}</td><td>${bal.toFixed(2)}</td><td><button class="btn btn-s" onclick="openSt(${i})">كشف</button> <a class="btn btn-w" target="_blank" href="https://wa.me/${p.phone}">واتساب</a></td></tr>`}).join('');}

window.delInv=i=>{inv.splice(i,1);localStorage.setItem('inv2',JSON.stringify(inv));renderInv();}
window.openSt=i=>{curPartner=partners[i];document.getElementById('st-name').textContent=curPartner.name;let rows=ledger.filter(l=>l.customer===curPartner.name);document.getElementById('st-details').innerHTML=rows.map(r=>`${r.date} - ${r.desc} - ${r.amount}π`).join('<br>')||'لا يوجد';document.getElementById('statement-box').style.display='block';}

function updateReports(){let f=ledger;let period=document.getElementById('rep-period').value;let now=new Date();if(period==='today') f=ledger.filter(l=>new Date(l.date).toDateString()===now.toDateString());if(period==='week'){let w=new Date();w.setDate(now.getDate()-7);f=ledger.filter(l=>new Date(l.date)>=w);}if(period==='month') f=ledger.filter(l=>new Date(l.date).getMonth()===now.getMonth());
let inc=f.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);let exp=f.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);let cogs=f.filter(x=>x.cogs).reduce((s,x)=>s+x.cogs,0);
document.getElementById('r-inc').textContent=inc.toFixed(3);document.getElementById('r-exp').textContent=exp.toFixed(3);document.getElementById('r-net').textContent=(inc-exp-cogs).toFixed(3);document.getElementById('r-cogs').textContent=cogs.toFixed(3);
let ctx=document.getElementById('financeChart'); if(chart) chart.destroy(); chart=new Chart(ctx,{type:'bar',data:{labels:['إيراد','مصروف','تكلفة','صافي'],datasets:[{data:[inc,exp,cogs,inc-exp-cogs],backgroundColor:['#4caf50','#f44336','#ff9800','#ffd700']}]},options:{plugins:{legend:{display:false}}}});
}

// EVENTS
document.getElementById('form-entry').addEventListener('submit',e=>{e.preventDefault();ledger.push({date:new Date().toLocaleDateString(),type:document.getElementById('e-type').value,amount:parseFloat(document.getElementById('e-amount').value),desc:document.getElementById('e-desc').value});localStorage.setItem('ledger',JSON.stringify(ledger));renderLedger();updateReports();e.target.reset();});
document.getElementById('form-inv').addEventListener('submit',e=>{e.preventDefault();inv.push({name:document.getElementById('p-name').value,qty:parseInt(document.getElementById('p-qty').value),price:parseFloat(document.getElementById('p-price').value),cost:parseFloat(document.getElementById('p-cost').value||0),min:parseInt(document.getElementById('p-min').value||5)});localStorage.setItem('inv2',JSON.stringify(inv));renderInv();e.target.reset();});
document.getElementById('form-part').addEventListener('submit',e=>{e.preventDefault();partners.push({name:document.getElementById('pt-name').value,type:document.getElementById('pt-type').value,phone:document.getElementById('pt-phone').value});localStorage.setItem('partners2',JSON.stringify(partners));renderPartners();e.target.reset();});

let invTotal=0;
document.getElementById('btn-add-to-inv').addEventListener('click',()=>{let idx=document.getElementById('inv-product').value;let q=parseInt(document.getElementById('inv-qty').value);if(idx==='')return;let prod=inv[idx];curInv.push({name:prod.name,price:prod.price,cost:prod.cost||0,qty:q});renderCurInv();});
function renderCurInv(){invTotal=curInv.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById('inv-items').innerHTML=curInv.map((it,k)=>`${it.name} x${it.qty} = ${(it.price*it.qty).toFixed(3)} <button onclick="curInv.splice(${k},1);renderCurInv()">x</button><br>`).join('');document.getElementById('inv-total').textContent=invTotal.toFixed(3);}

document.getElementById('btn-save-inv').addEventListener('click',()=>{if(!curInv.length) return alert('أضف منتجات');let cust=document.getElementById('inv-customer').value||'عميل';let cogs=curInv.reduce((s,i)=>s+i.cost*i.qty,0);ledger.push({date:new Date().toLocaleDateString(),type:'income',amount:invTotal,cogs,desc:`فاتورة ${cust}`,customer:cust});curInv.forEach(ci=>{let p=inv.find(x=>x.name===ci.name); if(p) p.qty-=ci.qty;});localStorage.setItem('ledger',JSON.stringify(ledger));localStorage.setItem('inv2',JSON.stringify(inv));renderInv();renderLedger();updateReports();curInv=[];renderCurInv();alert('تم حفظ الفاتورة وخصم المخزون');});

// PDF
document.getElementById('btn-pdf').addEventListener('click',()=>{let {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text(`Invoice - ${document.getElementById('inv-customer').value||'Customer'}`,10,10);let y=20;curInv.forEach(it=>{doc.text(`${it.name} x${it.qty} = ${it.price*it.qty} Pi`,10,y);y+=7;});doc.text(`Total: ${invTotal} Pi`,10,y+10);doc.save('invoice.pdf');});
document.getElementById('btn-report-pdf').addEventListener('click',()=>{let {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text('Pi Merchant Report',10,10);doc.text(`Income: ${document.getElementById('r-inc').textContent} Pi`,10,20);doc.text(`Expenses: ${document.getElementById('r-exp').textContent} Pi`,10,30);doc.text(`Net: ${document.getElementById('r-net').textContent} Pi`,10,40);doc.save('report.pdf');});
document.getElementById('btn-st-pdf').addEventListener('click',()=>{let {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text(`Statement: ${curPartner.name}`,10,10);let y=20;ledger.filter(l=>l.customer===curPartner.name).forEach(l=>{doc.text(`${l.date} ${l.desc} ${l.amount}`,10,y);y+=7;});doc.save('statement.pdf');});

// Excel
document.getElementById('btn-excel').addEventListener('click',()=>{let ws=XLSX.utils.json_to_sheet(ledger);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ledger');XLSX.writeFile(wb,'ledger.xlsx');});

// WhatsApp
document.getElementById('btn-wa').addEventListener('click',()=>{let phone=partners.find(p=>p.name===document.getElementById('inv-customer').value)?.phone||'';let text=`*فاتورة Pi Merchant*%0Aالعميل: ${document.getElementById('inv-customer').value}%0A${curInv.map(i=>`${i.name} x${i.qty} = ${i.price*i.qty} Pi`).join('%0A')}%0A*الإجمالي: ${invTotal} Pi*`;let url=`https://wa.me/${phone}?text=${text}`;if(phone) window.open(url,'_blank'); else {navigator.clipboard.writeText(decodeURIComponent(text)); alert('تم نسخ نص الواتساب - الصقه للعميل');}});

// Pi safe init
try{if(typeof Pi!=='undefined'){Pi.init({version:"2.0",sandbox:true});document.getElementById('pi-status').textContent='Pi SDK Ready';}else document.getElementById('pi-status').textContent='افتح في Pi Browser للدفع';}catch(e){document.getElementById('pi-status').textContent=e.message;}

document.getElementById('rep-period').addEventListener('change',updateReports);
renderLedger();renderInv();renderPartners();updateReports();
});
</script>
</body>
</html>
