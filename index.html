<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Merchant OS v2.1</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#2e004a}body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:10px}.container{max-width:1000px;margin:auto;background:rgba(255,255,255,.08);padding:15px;border-radius:16px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tab{padding:8px 11px;background:rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:12px;font-weight:700}.tab.active{background:var(--p);color:#2e004a}.tab-content{display:none}.tab-content.active{display:block}.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:8px 0}.btn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin:3px}.btn-pi{background:var(--p);color:#2e004a}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}input,select{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--s);margin:4px 0;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;font-size:13px}th{background:var(--s);color:#fff}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;justify-content:space-between;align-items:center"><div>👋 <span id="t-app">Pi Merchant OS v2.1</span></div>
<select id="lang-picker" style="width:auto;padding:6px"><option value="ar">العربية</option><option value="en">English</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select></div>
<h2 id="main-title" style="text-align:center;color:var(--p)">نظام التاجر الذكي</h2>
<div class="tabs">
<div class="tab active" data-tab="entry" id="lb-entry">قيد</div><div class="tab" data-tab="invoice" id="lb-inv">فاتورة</div><div class="tab" data-tab="inventory" id="lb-stock">مخزون</div><div class="tab" data-tab="partners" id="lb-part">عملاء</div><div class="tab" data-tab="reports" id="lb-rep">تقارير</div><div class="tab" data-tab="pay" id="lb-pay">Pi</div>
</div>

<div id="entry" class="tab-content active"><div class="card"><h3 id="h-entry">إضافة قيد</h3><form id="form-entry"><select id="e-type"><option value="income" id="op-inc">إيراد</option><option value="expense" id="op-exp">مصروف</option><option value="asset" id="op-ast">أصل</option></select><input id="e-amount" type="number" step="0.0001" placeholder="المبلغ π" required><input id="e-desc" placeholder="الوصف" required><button class="btn btn-pi" type="submit" id="btn-save-entry">حفظ</button></form></div><div class="card"><table><tbody id="ledger-body"></tbody></table></div></div>

<div id="invoice" class="tab-content"><div class="card"><h3 id="h-inv">إنشاء فاتورة</h3><input id="inv-customer" placeholder="اسم العميل"><select id="inv-product"></select><input id="inv-qty" type="number" value="1"><button class="btn btn-pi" id="btn-add-inv">إضافة للفاتورة</button><div id="inv-items"></div><h4><span id="lb-total">الإجمالي</span>: <span id="inv-total">0</span> π</h4><button class="btn btn-s" id="btn-pdf">PDF</button><button class="btn btn-w" id="btn-wa">WhatsApp</button><button class="btn btn-pi" id="btn-save-inv">حفظ وخصم</button></div></div>

<div id="inventory" class="tab-content"><div class="card"><form id="form-inv"><input id="p-name" placeholder="اسم المنتج" required><input id="p-qty" type="number" placeholder="الكمية" required><input id="p-price" type="number" step="0.0001" placeholder="سعر البيع" required><input id="p-cost" type="number" step="0.0001" placeholder="تكلفة الشراء"><input id="p-min" type="number" placeholder="حد التنبيه"><button class="btn btn-pi" type="submit" id="btn-add-prod">إضافة منتج</button></form></div><div class="card"><table><thead><tr><th>منتج</th><th>كمية</th><th>سعر</th><th>باركود</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>

<div id="partners" class="tab-content"><div class="card"><form id="form-part"><input id="pt-name" placeholder="الاسم" required><select id="pt-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select><input id="pt-phone" placeholder="واتساب 967..."><button class="btn btn-pi" type="submit">حفظ</button></form></div><div class="card"><table><tbody id="pt-body"></tbody></table></div></div>

<div id="reports" class="tab-content"><div class="card"><select id="rep-period"><option value="all">الكل</option><option value="today">اليوم</option><option value="week">أسبوع</option><option value="month">شهر</option></select><p><span id="lb-inc">إيراد</span>: <span id="r-inc">0</span> | <span id="lb-exp">مصروف</span>: <span id="r-exp">0</span> | <b id="lb-net">صافي</b>: <b id="r-net">0</b></p><div style="background:#fff;padding:8px;border-radius:8px"><canvas id="financeChart"></canvas></div><button class="btn btn-s" id="btn-excel">Excel</button><button class="btn btn-s" id="btn-report-pdf">PDF</button></div></div>

<div id="pay" class="tab-content"><div class="card"><input id="pay_amount" type="number" value="1"><button class="btn btn-pi" id="btn-pi-pay">Pay with Pi</button><div id="pi-status" style="margin-top:8px;color:gold"></div></div></div>
</div>
