<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Business OS v3.2 - Fixed Tabs + Lang + Migration</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#ffd700;--s:#6a1b9a;--bg:#1a0030}
body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:10px}
.container{max-width:1100px;margin:auto;background:rgba(255,255,255,.07);padding:14px;border-radius:16px}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#fff;color:#222;padding:10px;border-radius:12px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.tab{padding:8px 12px;background:rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.tab.active{background:var(--p);color:#1a0030}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:8px 0}
.btn{padding:9px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin:3px}
.btn-pi{background:var(--p);color:#1a0030}.btn-s{background:var(--s);color:#fff}.btn-w{background:#25D366;color:#fff}.btn-g{background:#eee;color:#333}.btn-red{background:#e53935;color:#fff}
input,select{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--s);margin:4px 0;box-sizing:border-box}
table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid #ddd;font-size:12px}th{background:var(--s);color:#fff}
.badge{background:#e0ffe0;color:#0a0;padding:4px 8px;border-radius:10px;font-size:11px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.store-item{background:#f8f8ff;border:1px solid #ddd;border-radius:12px;padding:8px;text-align:center}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div><b id="app-title">Pi Business OS v3.2</b><br><small id="user-info">غير مسجل</small></div>
<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
<select id="lang-picker" style="width:auto"><option value="ar">العربية</option><option value="en">English</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="ru">Русский</option></select>
<button class="btn btn-red" id="btn-migrate" style="font-size:11px">🔄 استرجاع</button>
<button class="btn btn-pi" id="btn-login">Login with Pi</button>
<button class="btn btn-g" id="btn-logout" style="display:none">خروج</button>
</div>
</div>
<h2 style="text-align:center;color:var(--p)" id="main-title">نظام محاسبي للرواد</h2>
<div style="text-align:center"><span class="badge" id="usage-badge">مجاني</span> <button class="btn btn-pi" id="btn-upgrade" style="padding:5px 10px;font-size:12px">Pro بـ 1 Pi</button></div>
<div class="tabs">
<div class="tab active" data-tab="entry" id="lb-entry">قيد</div>
<div class="tab" data-tab="invoice" id="lb-inv">فاتورة</div>
<div class="tab" data-tab="inventory" id="lb-stock">مخزون</div>
<div class="tab" data-tab="orders" id="lb-orders">طلبات</div>
<div class="tab" data-tab="store" id="lb-store">متجري</div>
<div class="tab" data-tab="reports" id="lb-rep">تقارير</div>
</div>
<div id="entry" class="tab-content active"><div class="card"><h3 id="h-entry">إضافة قيد</h3><form id="form-entry"><select id="e-type"><option value="income">إيراد</option><option value="expense">مصروف</option><option value="asset">أصل</option></select><input id="e-amount" type="number" step="0.0001" placeholder="المبلغ π" required><input id="e-desc" placeholder="الوصف" required><button class="btn btn-pi" type="submit" id="btn-save-entry">حفظ</button></form></div><div class="card"><table><tbody id="ledger-body"></tbody></table></div></div>
<div id="invoice" class="tab-content"><div class="card"><h3 id="h-inv">إنشاء فاتورة</h3><input id="inv-customer" placeholder="اسم العميل"><select id="inv-product"></select><input id="inv-qty" type="number" value="1" min="1"><button class="btn btn-pi" type="button" id="btn-add-inv">إضافة للفاتورة</button><div id="inv-items" style="background:#f9f9f9;padding:8px;border-radius:8px;margin:8px 0"></div><h4><span id="lb-total">الإجمالي</span>: <span id="inv-total">0</span> π</h4><button class="btn btn-pi" type="button" id="btn-save-inv" style="width:100%">💾 حفظ الفاتورة</button><div id="invoice-actions" style="display:none;margin-top:10px;border-top:2px dashed #6a1b9a;padding-top:8px"><span class="badge">✓ تم الحفظ</span><button class="btn btn-s" type="button" id="btn-pdf-last">PDF</button><button class="btn btn-w" type="button" id="btn-wa-last">WhatsApp</button><button class="btn btn-g" type="button" id="btn-new-inv">+ جديد</button></div></div><div class="card"><h4 id="h-saved">الفواتير المحفوظة</h4><div id="saved-invoices"></div></div></div>
<div id="inventory" class="tab-content"><div class="card"><form id="form-inv"><input id="p-name" placeholder="اسم المنتج" required><input id="p-qty" type="number" placeholder="الكمية" required><input id="p-price" type="number" step="0.0001" placeholder="سعر البيع π" required><input id="p-cost" type="number" step="0.0001" placeholder="التكلفة"><input id="p-img" placeholder="رابط صورة"><select id="p-cat"><option>عام</option><option>مواد غذائية</option><option>قرطاسية</option><option>إلكترونيات</option><option>ملابس</option></select><button class="btn btn-pi" type="submit">إضافة منتج</button></form></div><div class="card"><input id="search-prod" placeholder="بحث..."><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Barcode</th><th></th></tr></thead><tbody id="inv-body"></tbody></table></div></div>
<div id="orders" class="tab-content"><div class="card"><h3>الطلبات</h3><div id="orders-list"></div></div></div>
<div id="store" class="tab-content"><div class="card"><h3>متجري العام</h3><p>رابطك: <b id="store-link">سجل دخول</b> <button class="btn btn-w" id="btn-copy-store">نسخ</button></p><input id="store-name" placeholder="اسم متجرك"><input id="store-desc" placeholder="وصف"><button class="btn btn-s" type="button" id="btn-save-store">حفظ</button><div style="margin-top:12px"><div id="store-preview" class="store-grid"></div></div></div></div>
<div id="reports" class="tab-content"><div class="card"><p>إيراد: <span id="r-inc">0</span> | مصروف: <span id="r-exp">0</span> | صافي: <b id="r-net">0</b></p><div style="background:#fff;padding:8px;border-radius:8px"><canvas id="financeChart"></canvas></div><button class="btn btn-s" type="button" id="btn-excel">Excel</button><button class="btn btn-s" type="button" id="btn-report-pdf">PDF</button></div></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
const T={
ar:{entry:"قيد",invoice:"فاتورة",stock:"مخزون",orders:"طلبات",store:"متجري",rep:"تقارير",title:"نظام محاسبي للرواد",addEntry:"إضافة قيد",addInv:"إنشاء فاتورة",total:"الإجمالي",saveInv:"💾 حفظ الفاتورة",saved:"الفواتير المحفوظة"},
en:{entry:"Entry",invoice:"Invoice",stock:"Stock",orders:"Orders",store:"Store",rep:"Reports",title:"Pioneer Accounting",addEntry:"Add Entry",addInv:"Create Invoice",total:"Total",saveInv:"💾 Save Invoice",saved:"Saved Invoices"},
tr:{entry:"Kayıt",invoice:"Fatura",stock:"Stok",orders:"Siparişler",store:"Mağaza",rep:"Raporlar",title:"Öncü Muhasebe",addEntry:"Kayıt Ekle",addInv:"Fatura Oluştur",total:"Toplam",saveInv:"💾 Kaydet",saved:"Kaydedilen"},
zh:{entry:"记账",invoice:"发票",stock:"库存",orders:"订单",store:"商店",rep:"报告",title:"先锋会计",addEntry:"添加",addInv:"创建发票",total:"总计",saveInv:"💾 保存",saved:"已保存"},
ja:{entry:"仕訳",invoice:"請求書",stock:"在庫",orders:"注文",store:"ストア",rep:"レポート",title:"パイオニア会計",addEntry:"追加",addInv:"請求書作成",total:"合計",saveInv:"💾 保存",saved:"保存済み"},
vi:{entry:"Ghi chép",invoice:"Hóa đơn",stock:"Kho",orders:"Đơn",store:"Cửa hàng",rep:"Báo cáo",title:"Kế toán Pioneer",addEntry:"Thêm",addInv:"Tạo hóa đơn",total:"Tổng",saveInv:"💾 Lưu",saved:"Đã lưu"},
fr:{entry:"Écriture",invoice:"Facture",stock:"Stock",orders:"Commandes",store:"Boutique",rep:"Rapports",title:"Compta Pioneer",addEntry:"Ajouter",addInv:"Créer Facture",total:"Total",saveInv:"💾 Enregistrer",saved:"Sauvegardées"},
de:{entry:"Buchung",invoice:"Rechnung",stock:"Lager",orders:"Bestellungen",store:"Shop",rep:"Berichte",title:"Pioneer Buchhaltung",addEntry:"Hinzufügen",addInv:"Rechnung erstellen",total:"Gesamt",saveInv:"💾 Speichern",saved:"Gespeichert"},
es:{entry:"Asiento",invoice:"Factura",stock:"Inventario",orders:"Pedidos",store:"Tienda",rep:"Informes",title:"Contabilidad Pioneer",addEntry:"Agregar",addInv:"Crear Factura",total:"Total",saveInv:"💾 Guardar",saved:"Guardadas"},
ru:{entry:"Запись",invoice:"Счет",stock:"Склад",orders:"Заказы",store:"Магазин",rep:"Отчеты",title:"Бухгалтерия Пионеров",addEntry:"Добавить",addInv:"Создать счет",total:"Итого",saveInv:"💾 Сохранить",saved:"Сохраненные"}
};
function applyLang(l){
 let t=T[l]||T.ar;
 document.getElementById('lb-entry').textContent=t.entry;
 document.getElementById('lb-inv').textContent=t.invoice;
 document.getElementById('lb-stock').textContent=t.stock;
 document.getElementById('lb-orders').textContent=t.orders;
 document.getElementById('lb-store').textContent=t.store;
 document.getElementById('lb-rep').textContent=t.rep;
 document.getElementById('main-title').textContent=t.title;
 document.getElementById('h-entry').textContent=t.addEntry;
 document.getElementById('h-inv').textContent=t.addInv;
 document.getElementById('lb-total').textContent=t.total;
 document.getElementById('btn-save-inv').textContent=t.saveInv;
 document.getElementById('h-saved').textContent=t.saved;
 document.documentElement.dir = (l==='ar')?'rtl':'ltr';
 localStorage.setItem('pi_lang', l);
}
let savedLang=localStorage.getItem('pi_lang')||'ar';
document.getElementById('lang-picker').value=savedLang;
applyLang(savedLang);
document.getElementById('lang-picker').addEventListener('change', function(){ applyLang(this.value); });// Migration auto
if(!localStorage.getItem('migrated_v32')){
 ['ledger','inv2','invoices_v23','storeInfo'].forEach(function(k){
   let old=localStorage.getItem(k);
   if(old && !localStorage.getItem(k+'_guest')) localStorage.setItem(k+'_guest', old);
 });
 localStorage.setItem('migrated_v32','1');
}

let currentUser=localStorage.getItem('pi_current_user')||'guest';
let userDataKey=function(k){ return k+'_'+currentUser; };
function getData(k, def){ try{ return JSON.parse(localStorage.getItem(userDataKey(k))||JSON.stringify(def)); }catch(e){ return def; } }
function setData(k,v){ localStorage.setItem(userDataKey(k), JSON.stringify(v)); }
let ledger=getData('ledger',[]); let inv=getData('inv2',[]); let invoices=getData('invoices_v23',[]); let orders=getData('orders_v3',[]); let storeInfo=getData('storeInfo',{name:'',desc:''}); let isPro=getData('isPro',false);
let curInv=[]; let invTotal=0; let lastSavedInvoice=null; let chart=null;

function updateUserUI(){
 let u=currentUser;
 document.getElementById('user-info').textContent = u==='guest' ? 'guest - تجريبي' : '👤 @'+u + (isPro?' - Pro ⭐':'');
 document.getElementById('btn-login').style.display = u==='guest' ? 'inline-block':'none';
 document.getElementById('btn-logout').style.display = u==='guest' ? 'none':'inline-block';
 let link = location.origin + location.pathname.replace('index.html','') + 'store.html?user='+u;
 document.getElementById('store-link').textContent=link;
 document.getElementById('store-name').value=storeInfo.name||'';
 document.getElementById('store-desc').value=storeInfo.desc||'';
 document.getElementById('usage-badge').textContent = (isPro?'Pro':'مجاني')+': '+ledger.length+'/100 - '+inv.length+'/50';
}
updateUserUI();

// Tabs - FIXED
document.querySelectorAll('.tab').forEach(function(tab){
 tab.addEventListener('click', function(){
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(x){ x.classList.remove('active'); });
  tab.classList.add('active');
  let target=document.getElementById(tab.dataset.tab);
  if(target) target.classList.add('active');
 });
});

function renderLedger(){ document.getElementById('ledger-body').innerHTML=ledger.slice(-30).reverse().map(function(l){return '<tr><td>'+l.date+'</td><td>'+l.desc+'</td><td>'+l.type+'</td><td>'+l.amount+'</td></tr>';}).join(''); }
function renderInv(filter){
 filter=filter||'';
 let list=inv.filter(function(p){ return p.name.toLowerCase().includes(filter.toLowerCase()); });
 document.getElementById('inv-body').innerHTML=list.map(function(p,i){ return '<tr><td>'+p.name+'</td><td style="'+(p.qty<5?'color:red':'')+'">'+p.qty+'</td><td>'+p.price+'</td><td><svg id="bc'+i+'"></svg></td><td><button type="button" onclick="window.delInv('+inv.indexOf(p)+')">x</button></td></tr>'; }).join('');
 document.getElementById('inv-product').innerHTML=inv.map(function(p,i){ return '<option value="'+i+'">'+p.name+' - '+p.price+' Pi (Qty:'+p.qty+')</option>'; }).join('');
 setTimeout(function(){ list.forEach(function(p,i){ try{ JsBarcode('#bc'+i, p.name.substring(0,10)+i, {width:1,height:20,displayValue:false}); }catch(e){} }); },200);
 renderStorePreview();
}
function renderOrders(){ let box=document.getElementById('orders-list'); if(orders.length===0){ box.innerHTML='<small>لا يوجد طلبات</small>'; return; } box.innerHTML=orders.slice(-20).reverse().map(function(o){ return '<div style="border:1px solid #ccc;padding:8px;border-radius:8px;margin:5px 0"><b>'+o.customer+'</b> - '+o.total.toFixed(3)+' Pi<br>'+o.items.map(function(it){return it.name+' x'+it.qty}).join(', ')+'<br><button class="btn btn-s" type="button" onclick="window.acceptOrder('+o.id+')">قبول</button></div>'; }).join(''); }
function renderStorePreview(){ let preview=document.getElementById('store-preview'); if(inv.length===0){ preview.innerHTML='<small>أضف منتجات</small>'; return; } preview.innerHTML=inv.slice(0,12).map(function(p){ return '<div class="store-item"><b>'+p.name+'</b><br><b style="color:#6a1b9a">'+p.price+' Pi</b></div>'; }).join(''); }
function renderInvoicesList(){ let box=document.getElementById('saved-invoices'); if(invoices.length===0){ box.innerHTML='<small>لا يوجد فواتير</small>'; return; } box.innerHTML=invoices.slice(-20).reverse().map(function(it){ return '<div style="border:1px solid #ccc;padding:8px;border-radius:8px;margin:5px 0;background:#fafafa;color:#222"><b>#'+it.id+'</b> - '+it.customer+' - <b>'+it.total.toFixed(3)+' Pi</b><br>'+it.items.map(function(j){return j.name+' x'+j.qty}).join(', ')+'<br><button class="btn btn-s" type="button" onclick="window.pdfInvoice('+it.id+')">PDF</button><button class="btn btn-w" type="button" onclick="window.waInvoice('+it.id+')">WhatsApp</button></div>'; }).join(''); }
function updateReports(){
 let inc=ledger.filter(function(x){return x.type==='income'}).reduce(function(s,x){return s+x.amount},0);
 let exp=ledger.filter(function(x){return x.type==='expense'}).reduce(function(s,x){return s+x.amount},0);
 document.getElementById('r-inc').textContent=inc.toFixed(2);
 document.getElementById('r-exp').textContent=exp.toFixed(2);
 document.getElementById('r-net').textContent=(inc-exp).toFixed(2);
 let ctx=document.getElementById('financeChart');
 if(!ctx) return;
 if(chart) chart.destroy();
 chart=new Chart(ctx,{type:'bar',data:{labels:['Income','Expense','Net'],datasets:[{label:'Pi',data:[inc,exp,inc-exp],backgroundColor:['#4caf50','#f44336','#ffd700']}]},options:{responsive:true,plugins:{legend:{display:false}}}});
}
window.delInv=function(i){ inv.splice(i,1); setData('inv2', inv); renderInv(); updateUserUI(); };
window.acceptOrder=function(id){ let o=orders.find(function(x){return x.id===id}); if(!o) return; ledger.push({date:new Date().toLocaleDateString(), type:'income', amount:o.total, desc:'طلب '+o.customer}); setData('ledger', ledger); renderLedger(); updateReports(); alert('تم القبول'); };

document.getElementById('form-entry').addEventListener('submit',function(e){
 e.preventDefault();
 ledger.push({date:new Date().toLocaleDateString(), type:document.getElementById('e-type').value, amount:parseFloat(document.getElementById('e-amount').value), desc:document.getElementById('e-desc').value});
 setData('ledger', ledger); renderLedger(); updateReports(); updateUserUI(); e.target.reset();
});
document.getElementById('form-inv').addEventListener('submit',function(e){
 e.preventDefault();
 inv.push({name:document.getElementById('p-name').value, qty:parseInt(document.getElementById('p-qty').value), price:parseFloat(document.getElementById('p-price').value), cost:parseFloat(document.getElementById('p-cost').value||0), img:document.getElementById('p-img').value, cat:document.getElementById('p-cat').value});
 setData('inv2', inv); renderInv(); updateUserUI(); e.target.reset();
});
document.getElementById('search-prod').addEventListener('input',function(){ renderInv(this.value); });
function refreshCur(){
 let el=document.getElementById('inv-items');
 el.innerHTML = curInv.length===0 ? '<small>فارغة</small>' : curInv.map(function(it,idx){ return '<div>'+it.name+' x'+it.qty+' = '+(it.price*it.qty).toFixed(3)+' Pi <button type="button" onclick="window.removeCur('+idx+')" style="color:red;border:none;background:none">x</button></div>'; }).join('');
 document.getElementById('inv-total').textContent=invTotal.toFixed(3);
}
window.removeCur=function(idx){ curInv.splice(idx,1); invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty},0); refreshCur(); };
document.getElementById('btn-add-inv').addEventListener('click',function(){
 let idx=document.getElementById('inv-product').value; let q=parseInt(document.getElementById('inv-qty').value||1);
 if(idx==='') return;
 let prod=inv[idx];
 curInv.push({name:prod.name, price:prod.price, qty:q});
 invTotal=curInv.reduce(function(s,i){return s+i.price*i.qty},0); refreshCur();
});
document.getElementById('btn-save-inv').addEventListener('click',function(){
 if(curInv.length===0){ alert('أضف منتجات'); return; }
 let customer=document.getElementById('inv-customer').value||'عميل';
 let data={id:Date.now(), customer:customer, items:JSON.parse(JSON.stringify(curInv)), total:invTotal, date:new Date().toLocaleString()};
 invoices.push(data); lastSavedInvoice=data;
 setData('invoices_v23', invoices);
 ledger.push({date:new Date().toLocaleDateString(), type:'income', amount:invTotal, desc:'فاتورة '+customer});
 curInv.forEach(function(ci){ let p=inv.find(function(x){return x.name===ci.name}); if(p) p.qty-=ci.qty; });
 setData('ledger', ledger); setData('inv2', inv);
 renderInv(); renderLedger(); updateReports(); renderInvoicesList(); updateUserUI();
 document.getElementById('invoice-actions').style.display='block';
});
document.getElementById('btn-new-inv').addEventListener('click',function(){ curInv=[]; invTotal=0; refreshCur(); document.getElementById('invoice-actions').style.display='none'; });
function makePdf(d){ let jsPDF=window.jspdf.jsPDF; let doc=new jsPDF(); doc.text('Invoice #'+d.id,10,10); doc.text('Customer: '+d.customer,10,18); doc.text('Total: '+d.total.toFixed(3)+' Pi',10,26); let y=36; d.items.forEach(function(it){ doc.text(it.name+' x'+it.qty+' = '+(it.price*it.qty).toFixed(3)+' Pi',10,y); y+=8; }); return doc; }
document.getElementById('btn-pdf-last').addEventListener('click',function(){ if(lastSavedInvoice) makePdf(lastSavedInvoice).save('inv.pdf'); });
document.getElementById('btn-wa-last').addEventListener('click',function(){ if(lastSavedInvoice) window.waInvoice(lastSavedInvoice.id); });
window.pdfInvoice=function(id){ let d=invoices.find(function(x){return x.id===id}); if(d) makePdf(d).save('inv-'+id+'.pdf'); };
window.waInvoice=function(id){ let d=invoices.find(function(x){return x.id===id}); if(!d) return; let text='*فاتورة #'+d.id+'*%0A'+d.customer+'%0A'+d.items.map(function(i){return i.name+' x'+i.qty}).join('%0A')+'%0A*Total '+d.total.toFixed(3)+' Pi*'; window.open('https://wa.me/?text='+text,'_blank'); };
document.getElementById('btn-excel').addEventListener('click',function(){ let ws=XLSX.utils.json_to_sheet(ledger); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Ledger'); XLSX.writeFile(wb,'ledger.xlsx'); });
document.getElementById('btn-report-pdf').addEventListener('click',function(){ let jsPDF=window.jspdf.jsPDF; let doc=new jsPDF(); doc.text('Report',10,10); doc.save('report.pdf'); });
document.getElementById('btn-save-store').addEventListener('click',function(){ storeInfo.name=document.getElementById('store-name').value; storeInfo.desc=document.getElementById('store-desc').value; setData('storeInfo', storeInfo); alert('تم الحفظ'); });
document.getElementById('btn-copy-store').addEventListener('click',function(){ let link=document.getElementById('store-link').textContent; navigator.clipboard.writeText(link).then(function(){alert('تم النسخ');}); });
document.getElementById('btn-migrate').addEventListener('click',function(){
 ['ledger','inv2','invoices_v23','storeInfo'].forEach(function(k){
   let old=localStorage.getItem(k);
   if(old) localStorage.setItem(k+'_guest', old);
 });
 ledger=getData('ledger',[]); inv=getData('inv2',[]); invoices=getData('invoices_v23',[]); storeInfo=getData('storeInfo',{name:'',desc:''});
 updateUserUI(); renderLedger(); renderInv(); renderInvoicesList(); renderOrders(); updateReports(); refreshCur();
 alert('✅ تم الاسترجاع: '+ledger.length+' قيد - '+inv.length+' منتج');
});
try{ if(typeof Pi!=='undefined'){ Pi.init({version:'2.0', sandbox:true}); } }catch(e){}
document.getElementById('btn-login').addEventListener('click', async function(){
