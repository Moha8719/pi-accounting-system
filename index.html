<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Accounting ERP - Pi Network</title>
    
    <!-- Pi Network SDK - هام جداً لتسجيل الدخول والدفع -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <!-- CSS - تصميم واجهة عصرية وسهلة للجوال -->
    <style>
        :root {
            --primary-color: #ffd700; /* لون باي - ذهبي */
            --secondary-color: #6a1b9a; /* لون باي - بنفسجي غامق */
            --text-color: #ffffff;
            --bg-color: #2e004a; /* خلفية عصرية غامقة */
            --container-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: right;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .pi-icon {
            color: var(--primary-color);
            font-weight: bold;
        }

        /* تنسيق الأزرار */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .btn-pi {
            background-color: var(--primary-color);
            color: #2e004a;
        }

        .btn-pi:hover {
            background-color: #fffb00;
        }

        /* تنسيق المدخلات - Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }

        /* تنسيق الجداول - Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            text-align: right;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        /* تنسيق التبويبات - Tabs */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-color);
            border-radius: 10px 10px 0 0;
            background-color: rgba(255, 255, 255, 0.05);
            margin-left: 5px;
        }
