<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Accounting ERP - Pi Network</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #ffd700; --secondary: #6a1b9a; --bg: #2e004a; }
        body { font-family: 'Segoe UI', Tahoma; background: var(--bg); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1,h2,h3 { text-align: center; color: var(--primary); }
        .btn { padding: 10px 20px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; margin: 5px 0; }
        .btn-pi { background: var(--primary); color: #2e004a; } .btn-sec { background: var(--secondary); color: #fff; }
        .form-group { margin-bottom: 15px; } label { display: block; margin-bottom: 5px; color: var(--primary); }
        input,select { width: 100%; padding: 10px; border: 2px solid var(--secondary); border-radius: 8px; background: rgba(255,255,255,0.9); color: #333; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.9); color: #333; border-radius: 8px; overflow: hidden; }
        th,td { padding: 10px; border-bottom: 1px solid #ddd; } th { background: var(--secondary); color: #fff; }
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid var(--secondary); padding-bottom: 10px; }
        .tab { padding: 8px 12px; cursor: pointer; border-radius: 8px; background: rgba(255,255,255,0.1); font-size: 12px; font-weight: bold; }
        .tab.active { background: var(--primary); color: #2e004a; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .lang-select { width: auto; padding: 5px 10px; background: var(--secondary); color: #fff; border-radius: 5px; border: none; }
        .chart-container { height: 250px; background: #fff; border-radius: 8px; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <div>
            <label style="font-size:11px;">Language / اللغة:</label>
            <select id="lang-picker" class="lang-select">
                <option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option>
            </select>
        </div>
        <div style="color:#ffeb3b; font-size:13px;"><span id="txt-welcome">مرحباً</span>: <span id="pi_username">Pi Merchant</span></div>
    </div>
    <h1 id="main-title">النظام المحاسبي الذكي <span style="color:#ffd700">π</span></h1>
    <div class="tabs">
        <div class="tab active" data-tab="entry" id="t-entry">إضافة قيد</div>
        <div class="tab" data-tab="ledger" id="t-ledger">دفتر الأستاذ</div>
        <div class="tab" data-tab="inventory" id="t-inv">المخزون</div>
        <div class="tab" data-tab="partners" id="t-part">العملاء والموردين</div>
        <div class="tab" data-tab="income" id="t-income">قائمة الدخل</div>
        <div class="tab" data-tab="pay" id="t-pay">الدفع بـ Pi</div>
    </div>

    <div id="entry" class="tab-content active">
        <h2>إضافة قيد محاسبي</h2>
        <form id="accounting-form">
            <div class="form-group"><label>نوع العملية:</label><select id="entry-type"><option value="income">إيراد (+)</option><option value="expense">مصروف (-)</option><option value="asset">أصل (+)</option></select></div>
            <div class="form-group"><label>المبلغ (π):</label><input type="number" id="amount" step="0.0001" required></div>
            <div class="form-group"><label>الوصف:</label><input type="text" id="description" required></div>
            <button type="submit" class="btn btn-pi">حفظ القيد</button>
        </form>
    </div>
    <div id="ledger" class="tab-content">
        <h2>دفتر الأستاذ</h2><button class="btn btn-sec" id="btn-csv">تصدير CSV</button> <button class="btn btn-sec" onclick="window.print()">طباعة</button>
        <table><thead><tr><th>التاريخ</th><th>الوصف</th><th>النوع</th><th>المبلغ</th></tr></thead><tbody id="ledger-body"></tbody></table>
    </div>
    <div id="inventory" class="tab-content">
        <h2>المخزون</h2>
        <form id="inv-form"><div class="form-group"><input type="text" id="prod-name" placeholder="اسم المنتج" required></div><div class="form-group"><input type="number" id="prod-qty" placeholder="الكمية" required></div><div class="form-group"><input type="number" id="prod-price" step="0.0001" placeholder="السعر π" required></div><button type="submit" class="btn btn-pi">إضافة</button></form>
        <table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th></tr></thead><tbody id="inv-body"></tbody></table>
    </div>
    <div id="partners" class="tab-content">
        <h2>العملاء والموردين</h2>
        <form id="partner-form"><input type="text" id="part-name" placeholder="الاسم" required><select id="part-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select><input type="text" id="part-phone" placeholder="الهاتف"><button type="submit" class="btn btn-pi">حفظ</button></form>
        <table><thead><tr><th>الاسم</th><th>النوع</th><th>الهاتف</th></tr></thead><tbody id="partner-body"></tbody></table>
