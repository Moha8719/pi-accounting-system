<script>
function applyLang(l){let t=I18N[l]||I18N.ar;document.documentElement.lang=l;document.documentElement.dir=t.dir;let g=id=>document.getElementById(id);if(!g('app-name')) return;g('app-name').textContent=t.appName;g('version-badge').textContent=t.badge;g('btn-migrate').textContent=t.restore;g('btn-login').textContent=t.login;g('btn-logout').textContent=t.logout;g('tab-tree').textContent=t.tabTree;g('tab-entry').textContent=t.tabEntry;g('tab-ledger').textContent=t.tabLedger;g('tab-customers').textContent=t.tabCustomers;g('tab-vouchers').textContent=t.tabVouchers;g('tab-invoice').textContent=t.tabInvoice;g('tab-inventory').textContent=t.tabInventory;g('tab-financials').textContent=t.tabFinancials;g('tab-reports').textContent=t.tabReports;g('h-tree').textContent=t.hTree;g('btn-save-acc').textContent=t.saveAcc;g('h-entry').textContent=t.hEntry;g('entry-help').textContent=t.help;g('h-ledger').textContent=t.hLedger;g('h-account-ledger').textContent=t.hAccountLedger;g('desc-account-ledger').textContent=t.descLedger;g('btn-filter-ledger').textContent=t.filter;g('btn-export-ledger').textContent=t.export;g('btn-print-ledger').textContent=t.printLedger;g('h-customers').textContent=t.hCustomers;g('desc-customers').textContent=t.descCustomers;g('btn-filter-customer').textContent=t.filter;g('btn-export-customer').textContent=t.export;g('btn-wa-customer').textContent=t.waCustomer;g('h-vouchers').textContent=t.hVouchers;g('btn-show-receipt').textContent=t.btnReceipt;g('btn-show-payment').textContent=t.btnPayment;g('h-vouchers-list').textContent=t.hVouchersList;g('h-inv').textContent=t.hInv;g('btn-add-inv').textContent=t.add;g('lb-total').textContent=t.total;g('btn-save-inv').textContent=t.saveInv;g('h-add-prod').textContent=t.hAddProd;g('btn-add-prod').textContent=t.addProd;g('h-financials').textContent=t.hFinancials;g('btn-gen-income').textContent=t.btnIncome;g('btn-gen-balance').textContent=t.btnBalance;g('btn-export-financials').textContent=t.btnExport;g('h-reports').textContent=t.hReports;g('lb-inc').textContent=t.inc;g('lb-exp').textContent=t.exp;g('lb-net').textContent=t.net;g('btn-excel').textContent=t.excel;g('btn-report-pdf').textContent=t.trialPdf;g('setup-title').textContent=t.setupTitle;g('setup-desc').textContent=t.setupDesc;g('btn-do-setup').textContent=t.doSetup;g('btn-save-voucher').textContent=t.saveVoucher;localStorage.setItem('pi_lang', l);renderAll();}
window._t=function(k){let l=localStorage.getItem('pi_lang')||'ar';return (I18N[l]||I18N.ar)[k]||k;};
let currentUser=localStorage.getItem('pi_current_user')||'guest';let k=function(n){return n+'_'+currentUser;};function getData(n,d){try{return JSON.parse(localStorage.getItem(k(n))||JSON.stringify(d));}catch(e){return d;}}function setData(n,v){localStorage.setItem(k(n), JSON.stringify(v));}
let accounts=getData('accounts_v4', null);let ledger=getData('ledger_double', []);let vouchers=getData('vouchers_v1', []);let inv=getData('inv2',[]);let invoices=getData('invoices_v23',[]);let sysConfig=getData('sysConfig', null);let curInv=[];let invTotal=0;let chart=null;let voucherCounter=getData('voucherCounter', 1001);
function defaultTree(){return [{id:'1',code:'1000',name:'Assets',parent:null,type:'asset'},{id:'11',code:'1100',name:'Current Assets',parent:'1',type:'asset'},{id:'111',code:'1101',name:'Cash - Pi',parent:'11',type:'asset'},{id:'112',code:'1102',name:'Bank',parent:'11',type:'asset'},{id:'113',code:'1103',name:'Receivables',parent:'11',type:'asset'},{id:'2',code:'2000',name:'Liabilities',parent:null,type:'liability'},{id:'21',code:'2100',name:'Payables',parent:'2',type:'liability'},{id:'3',code:'3000',name:'Equity',parent:null,type:'equity'},{id:'31',code:'3001',name:'Capital',parent:'3',type:'equity'},{id:'4',code:'4000',name:'Income',parent:null,type:'income'},{id:'41',code:'4100',name:'Sales',parent:'4',type:'income'},{id:'5',code:'5000',name:'Expenses',parent:null,type:'expense'},{id:'51',code:'5100',name:'Rent',parent:'5',type:'expense'},{id:'52',code:'5200',name:'General Expenses',parent:'5',type:'expense'}];}
function checkSetup(){if(!accounts||!sysConfig){document.getElementById('setup-modal').style.display='flex';}else{document.getElementById('setup-modal').style.display='none';}}
function renderTree(){if(!accounts) return;let html='';function node(pid,d){accounts.filter(a=>a.parent===pid).forEach(acc=>{let debit=ledger.filter(x=>x.debitId===acc.id).reduce((s,x)=>s+x.amount,0);let credit=ledger.filter(x=>x.creditId===acc.id).reduce((s,x)=>s+x.amount,0);let cls=d===1?'tree-item l1':'tree-item';html+=`<div class="${cls}"><div><b>${acc.code}</b> ${acc.name} <small style="color:#666">(${(debit-credit).toFixed(1)})</small></div><div><button onclick="window.delAcc('${acc.id}')" style="background:none;border:none;color:red">x</button></div></div>`;node(acc.id,d+1);});}node(null,1);document.getElementById('tree-container').innerHTML=html;let opts=accounts.map(a=>`<option value="${a.id}">${a.code} - ${a.name}</option>`).join('');document.getElementById('acc-parent').innerHTML='<option value="">Root</option>'+opts;document.getElementById('e-debit').innerHTML=opts;document.getElementById('e-credit').innerHTML=opts;document.getElementById('v-account').innerHTML=opts;document.getElementById('ledger-account-select').innerHTML='<option value="">Select</option>'+opts;}
window.delAcc=function(id){if(accounts.some(a=>a.parent===id)) return alert('Has children');if(ledger.some(x=>x.debitId===id||x.creditId===id)) return alert('Has entries');accounts=accounts.filter(a=>a.id!==id);setData('accounts_v4', accounts);renderAll();};
function renderLedger(){document.getElementById('ledger-body').innerHTML=ledger.slice(-50).reverse().map(x=>{let dAcc=accounts.find(a=>a.id===x.debitId);let cAcc=accounts.find(a=>a.id===x.creditId);return `<tr><td>${x.date}</td><td>${dAcc?dAcc.name:x.debitCode}</td><td>${cAcc?cAcc.name:x.creditCode}</td><td>${x.desc}</td><td>${x.amount}</td></tr>`;}).join('');}
function renderAccountLedger(){let accId=document.getElementById('ledger-account-select').value;if(!accId) return;let filtered=ledger.filter(x=>x.debitId===accId||x.creditId===accId);let running=0;let rows='';filtered.forEach(x=>{let isDebit=x.debitId===accId;let debit=isDebit?x.amount:0;let credit=isDebit?0:x.amount;let acc=accounts.find(a=>a.id===accId);if(acc&&(acc.type==='asset'||acc.type==='expense')){running+=debit-credit;}else{running+=credit-debit;}rows+=`<tr><td>${x.date}</td><td>${x.desc}</td><td>${debit?debit.toFixed(2):'-'}</td><td>${credit?credit.toFixed(2):'-'}</td><td>${running.toFixed(2)}</td></tr>`;});document.getElementById('account-ledger-body').innerHTML=rows;document.getElementById('account-ledger-balance').innerHTML=`<div style="background:${running>=0?'#e8f5e9':'#ffebee'};padding:8px;border-radius:6px;text-align:center;font-weight:700">Balance: ${running.toFixed(3)}</div>`;}
function renderCustomerSelect(){let customers=[...new Set(invoices.map(i=>i.customer).concat(vouchers.map(v=>v.fromto)))].filter(Boolean);let sel=document.getElementById('customer-select');sel.innerHTML='<option value="">Select</option>'+customers.map(c=>`<option value="${c}">${c}</option>`).join('');}
function renderCustomerStatement(){let cust=document.getElementById('customer-select').value;if(!cust) return;let custInvoices=invoices.filter(i=>i.customer===cust);let custVouchers=vouchers.filter(v=>v.fromto===cust);let all=[];custInvoices.forEach(inv=>{all.push({date:inv.date, type:'Invoice', desc:'Invoice #'+inv.id, debit:inv.total, credit:0});});custVouchers.forEach(v=>{if(v.type==='receipt'){all.push({date:v.date, type:'Receipt', desc:v.desc, debit:0, credit:v.amount});}else{all.push({date:v.date, type:'Payment', desc:v.desc, debit:v.amount, credit:0});}});all.sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=0;let rows=all.map(r=>{bal+=r.debit-r.credit;return `<tr><td>${r.date}</td><td>${r.type}</td><td>${r.desc}</td><td>${r.debit?r.debit.toFixed(2):'-'}</td><td>${r.credit?r.credit.toFixed(2):'-'}</td><td>${bal.toFixed(2)}</td></tr>`;}).join('');document.getElementById('customer-ledger-body').innerHTML=rows;document.getElementById('customer-summary').innerHTML=`<div style="background:#e8f5e9;padding:6px;border-radius:6px">Balance Due: ${bal.toFixed(2)}</div>`;}function renderVouchers(){let box=document.getElementById('vouchers-list');if(vouchers.length===0){box.innerHTML=window._t('noVouchers');return;}box.innerHTML=vouchers.slice(-30).reverse().map(v=>`<div style="background:${v.type==='receipt'?'#e8f5e9':'#ffebee'};padding:6px;margin:4px;border-radius:6px;display:flex;justify-content:space-between"><b>${v.type} #${v.number}</b> ${v.fromto} - ${v.amount} ${v.desc}</div>`).join('');}
function renderInv(f){f=f||'';let list=inv.filter(p=>p.name.toLowerCase().includes(f.toLowerCase()));document.getElementById('inv-body').innerHTML=list.map(p=>`<tr><td>${p.name}</td><td>${p.qty}</td><td>${p.price}</td><td><button onclick="window.delInv(${inv.indexOf(p)})" style="background:none;border:none;color:red">x</button></td></tr>`).join('');document.getElementById('inv-product').innerHTML='<option value="">Select</option>'+inv.map((p,i)=>`<option value="${i}">${p.name} - ${p.price}</option>`).join('');}
function renderInvoices(){document.getElementById('saved-invoices').innerHTML=invoices.slice(-10).reverse().map(it=>`<div style="font-size:10px">#${it.id} ${it.customer} ${it.total}</div>`).join('');}
function refreshCur(){document.getElementById('inv-items').innerHTML=curInv.length===0?window._t('emptyCart'):curInv.map((it,idx)=>`<div style="display:flex;justify-content:space-between">${it.name} x${it.qty} = ${(it.price*it.qty).toFixed(2)} <button onclick="window.removeCur(${idx})" style="background:none;border:none;color:red">x</button></div>`).join('');document.getElementById('inv-total').textContent=invTotal.toFixed(3);}
function updateReports(){if(!accounts) return;let inc=0,exp=0;ledger.forEach(x=>{let a=accounts.find(z=>z.id===x.creditId);if(a&&a.type==='income') inc+=x.amount;let b=accounts.find(z=>z.id===x.debitId);if(b&&b.type==='expense') exp+=x.amount;});document.getElementById('r-inc').textContent=inc.toFixed(2);document.getElementById('r-exp').textContent=exp.toFixed(2);document.getElementById('r-net').textContent=(inc-exp).toFixed(2);let ctx=document.getElementById('report-chart');if(ctx){if(chart) chart.destroy();chart=new Chart(ctx,{type:'bar',data:{labels:['Income','Expense','Net'],datasets:[{label:'Amount',data:[inc,exp,inc-exp],backgroundColor:['#4caf50','#f44336','#2196f3']}]}});}}
window.delInv=function(i){inv.splice(i,1);setData('inv2', inv);renderInv();};window.removeCur=function(idx){curInv.splice(idx,1);invTotal=curInv.reduce((s,i)=>s+i.price*i.qty,0);refreshCur();};
function renderAll(){checkSetup();if(!accounts) return;renderTree();renderLedger();renderVouchers();renderCustomerSelect();renderInv();renderInvoices();refreshCur();updateReports();}
document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click', function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active');});});
document.getElementById('btn-do-setup').addEventListener('click', function(){let activity=document.getElementById('setup-activity').value;let currency=document.getElementById('setup-currency').value;let capital=parseFloat(document.getElementById('setup-capital').value||0);accounts=defaultTree();sysConfig={activity:activity,currency:currency,capital:capital};setData('accounts_v4', accounts);setData('sysConfig', sysConfig);if(capital>0){let cash=accounts.find(a=>a.code==='1101');let cap=accounts.find(a=>a.code==='3001');if(cash&&cap) ledger.push({date:new Date().toLocaleDateString(), debitId:cash.id, debitCode:cash.code, creditId:cap.id, creditCode:cap.code, amount:capital, desc:'Opening Capital'});setData('ledger_double', ledger);}document.getElementById('setup-modal').style.display='none';renderAll();});
document.getElementById('form-account').addEventListener('submit', function(e){e.preventDefault();let parent=document.getElementById('acc-parent').value||null;let na={id:Date.now().toString(), code:document.getElementById('acc-code').value, name:document.getElementById('acc-name').value, parent:parent, type:document.getElementById('acc-type').value};accounts.push(na);setData('accounts_v4', accounts);renderAll();e.target.reset();});
document.getElementById('form-entry').addEventListener('submit', function(e){e.preventDefault();let dId=document.getElementById('e-debit').value;let cId=document.getElementById('e-credit').value;if(dId===cId) return alert('Same account');if(!dId||!cId) return alert('Select accounts');let dAcc=accounts.find(a=>a.id===dId);let cAcc=accounts.find(a=>a.id===cId);ledger.push({date:new Date().toLocaleDateString(), debitId:dId, debitCode:dAcc.code, creditId:cId, creditCode:cAcc.code, amount:parseFloat(document.getElementById('e-amount').value), desc:document.getElementById('e-desc').value});setData('ledger_double', ledger);renderAll();e.target.reset();});
document.getElementById('btn-filter-ledger').addEventListener('click', renderAccountLedger);
document.getElementById('btn-export-ledger').addEventListener('click', function(){let accId=document.getElementById('ledger-account-select').value;let data=ledger.filter(x=>x.debitId===accId||x.creditId===accId);let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'AccountLedger');XLSX.writeFile(wb,'account_ledger.xlsx');});
document.getElementById('btn-print-ledger').addEventListener('click', function(){window.print();});
document.getElementById('btn-filter-customer').addEventListener('click', renderCustomerStatement);
document.getElementById('btn-export-customer').addEventListener('click', function(){let cust=document.getElementById('customer-select').value;if(!cust) return;let data=invoices.filter(i=>i.customer===cust);let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Customer');XLSX.writeFile(wb,cust+'_statement.xlsx');});
document.getElementById('btn-wa-customer').addEventListener('click', function(){let cust=document.getElementById('customer-select').value;let bal=document.getElementById('customer-summary').innerText;if(!cust) return;let msg=encodeURIComponent(`Statement for ${cust}\n${bal}`);window.open(`https://wa.me/?text=${msg}`,'_blank');});
document.getElementById('btn-show-receipt').addEventListener('click', function(){document.getElementById('voucher-form-card').style.display='block';document.getElementById('v-type').value='receipt';document.getElementById('v-number').value=voucherCounter;document.getElementById('v-date').valueAsDate=new Date();});
document.getElementById('btn-show-payment').addEventListener('click', function(){document.getElementById('voucher-form-card').style.display='block';document.getElementById('v-type').value='payment';document.getElementById('v-number').value=voucherCounter;document.getElementById('v-date').valueAsDate=new Date();});
document.getElementById('form-inv').addEventListener('submit', function(e){e.preventDefault();inv.push({name:document.getElementById('p-name').value, qty:parseInt(document.getElementById('p-qty').value), price:parseFloat(document.getElementById('p-price').value), cost:parseFloat(document.getElementById('p-cost').value||0)});setData('inv2', inv);renderAll();e.target.reset();});
document.getElementById('search-prod').addEventListener('input', function(){renderInv(this.value);});
document.getElementById('btn-add-inv').addEventListener('click', function(){let idx=document.getElementById('inv-product').value;if(idx==='') return;let prod=inv[idx];let q=parseInt(document.getElementById('inv-qty').value||1);curInv.push({name:prod.name, price:prod.price, qty:q});invTotal=curInv.reduce((s,i)=>s+i.price*i.qty,0);refreshCur();});
document.getElementById('btn-save-inv').addEventListener('click', function(){if(curInv.length===0) return alert('Empty');let customer=document.getElementById('inv-customer').value||'عميل';invoices.push({id:Date.now(), customer:customer, items:JSON.parse(JSON.stringify(curInv)), total:invTotal, date:new Date().toLocaleString()});setData('invoices_v23', invoices);let cash=accounts.find(a=>a.code==='1101');let sales=accounts.find(a=>a.code==='4100');if(cash&&sales){ledger.push({date:new Date().toLocaleDateString(), debitId:cash.id, debitCode:cash.code, creditId:sales.id, creditCode:sales.code, amount:invTotal, desc:'Invoice '+customer});setData('ledger_double', ledger);}curInv.forEach(ci=>{let p=inv.find(x=>x.name===ci.name);if(p) p.qty-=ci.qty;});setData('inv2', inv);curInv=[];invTotal=0;renderAll();});
document.getElementById('btn-save-voucher').addEventListener('click', function(e){e.preventDefault();let type=document.getElementById('v-type').value;let number=document.getElementById('v-number').value||voucherCounter;let date=document.getElementById('v-date').value||new Date().toLocaleDateString();let fromto=document.getElementById('v-fromto').value;if(!fromto) return alert('Enter From/To');let amount=parseFloat(document.getElementById('v-amount').value);let accountId=document.getElementById('v-account').value;let desc=document.getElementById('v-desc').value;let payMethod=document.getElementById('v-payment-method').value;let v={id:Date.now().toString(), type:type, number:number, date:date, fromto:fromto, amount:amount, accountId:accountId, desc:desc, paymentMethod:payMethod};vouchers.push(v);voucherCounter++;setData('vouchers_v1', vouchers);setData('voucherCounter', voucherCounter);let cashAcc=accounts.find(a=>a.code==='1101');let mainAcc=cashAcc;let targetAcc=accounts.find(a=>a.id===accountId);if(targetAcc&&mainAcc){if(type==='receipt'){ledger.push({date:date, debitId:mainAcc.id, debitCode:mainAcc.code, creditId:targetAcc.id, creditCode:targetAcc.code, amount:amount, desc:'Receipt #'+number+' '+fromto});}else{ledger.push({date:date, debitId:targetAcc.id, debitCode:targetAcc.code, creditId:mainAcc.id, creditCode:mainAcc.code, amount:amount, desc:'Payment #'+number+' '+fromto});}setData('ledger_double', ledger);}renderAll();document.getElementById('voucher-form-card').style.display='none';});
document.getElementById('btn-excel').addEventListener('click', function(){let ws=XLSX.utils.json_to_sheet(ledger);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ledger');XLSX.writeFile(wb,'ledger.xlsx');});
document.getElementById('btn-report-pdf').addEventListener('click', function(){let jsPDF=window.jspdf.jsPDF;let doc=new jsPDF();doc.text('Trial Balance - '+new Date().toLocaleDateString(),10,10);let y=20;accounts.forEach(acc=>{let d=ledger.filter(x=>x.debitId===acc.id).reduce((s,x)=>s+x.amount,0);let c=ledger.filter(x=>x.creditId===acc.id).reduce((s,x)=>s+x.amount,0);if(d||c){doc.text(acc.code+' '+acc.name+' D:'+d+' C:'+c,10,y);y+=7;if(y>270){doc.addPage();y=10;}}});doc.save('trial.pdf');});
document.getElementById('btn-gen-income').addEventListener('click', function(){let inc=0,exp=0;ledger.forEach(x=>{let a=accounts.find(z=>z.id===x.creditId);if(a&&a.type==='income') inc+=x.amount;let b=accounts.find(z=>z.id===x.debitId);if(b&&b.type==='expense') exp+=x.amount;});document.getElementById('financials-output').innerHTML=`<div class="statement"><h5>${window._t('incomeTitle')}</h5><div>Revenues: ${inc.toFixed(2)}</div><div>Expenses: ${exp.toFixed(2)}</div><div style="font-weight:700">Net: ${(inc-exp).toFixed(2)}</div></div>`;});
document.getElementById('btn-gen-balance').addEventListener('click', function(){let assets=0,liab=0,equity=0;accounts.forEach(acc=>{let d=ledger.filter(x=>x.debitId===acc.id).reduce((s,x)=>s+x.amount,0);let c=ledger.filter(x=>x.creditId===acc.id).reduce((s,x)=>s+x.amount,0);let bal=d-c;if(acc.type==='asset') assets+=bal;if(acc.type==='liability') liab+=(c-d);if(acc.type==='equity') equity+=(c-d);});document.getElementById('financials-output').innerHTML=`<div class="statement"><h5>${window._t('balanceTitle')}</h5><div>Assets: ${assets.toFixed(2)}</div><div>Liabilities: ${liab.toFixed(2)}</div><div>Equity: ${equity.toFixed(2)}</div><div>Check: ${(assets-(liab+equity)).toFixed(2)}</div></div>`;});
document.getElementById('btn-export-financials').addEventListener('click', function(){let jsPDF=window.jspdf.jsPDF;let doc=new jsPDF();doc.text(document.getElementById('financials-output').innerText,10,10);doc.save('financials.pdf');});
document.getElementById('btn-migrate').addEventListener('click', function(){renderAll();alert('Done '+window._t('balanced'));});
document.getElementById('btn-login').addEventListener('click', async function(){try{if(typeof Pi==='undefined'){alert('Pi Browser only');return;}let auth=await Pi.authenticate(['username'], function(){});currentUser=auth.user.username;localStorage.setItem('pi_current_user', currentUser);document.getElementById('user-info').textContent=currentUser;accounts=getData('accounts_v4', null);ledger=getData('ledger_double', []);vouchers=getData('vouchers_v1', []);inv=getData('inv2',[]);invoices=getData('invoices_v23',[]);sysConfig=getData('sysConfig', null);voucherCounter=getData('voucherCounter', 1001);document.getElementById('btn-login').style.display='none';document.getElementById('btn-logout').style.display='inline';renderAll();}catch(e){alert(e.message);}}});
document.getElementById('btn-logout').addEventListener('click', function(){localStorage.removeItem('pi_current_user');currentUser='guest';document.getElementById('user-info').textContent='';document.getElementById('btn-login').style.display='inline';document.getElementById('btn-logout').style.display='none';accounts=getData('accounts_v4', null);ledger=getData('ledger_double', []);vouchers=getData('vouchers_v1', []);inv=getData('inv2',[]);invoices=getData('invoices_v23',[]);sysConfig=getData('sysConfig', null);renderAll();});
let savedLang=localStorage.getItem('pi_lang')||'ar';document.getElementById('lang-picker').value=savedLang;applyLang(savedLang);
document.getElementById('lang-picker').addEventListener('change', function(){applyLang(this.value);});
renderAll();
</script>
</body>
</html>
